card:
  title: 深度学习：用梯度流定位训练信号断点
  summary: 绘制各层梯度并排查 NaN、消失或爆炸时，用深层网络中的信号传播机制区分初始化、激活函数和学习率造成的问题。
  context: "训练失败只表现为损失不降时，无法区分数据、前向数值与反向信号问题；本课通过逐层梯度证据缩小故障范围。"
  intuition: "把网络看成信号管道：同时检查激活和梯度在每层的尺度，找到它们第一次变成零、极大或非有限值的位置。"
  key_points:
    - "梯度消失表现为靠近输入的层梯度逐层趋近零，常与饱和激活或不合适权重尺度有关。"
    - "梯度爆炸表现为范数随深度急剧增大，可能进一步造成参数更新溢出和 NaN。"
    - "学习率影响参数更新而不直接改变当前反向导数；初始化与激活则会改变前向和梯度传播本身。"
  application: "为每层记录激活均值、标准差和梯度范数，启用有限值断言，并从首次异常层回查初始化、激活与更新尺度。"
  check_question: "若 backward 后各层梯度都有限且尺度正常，但 optimizer step 后参数立刻变成 NaN，你会优先检查什么？"
