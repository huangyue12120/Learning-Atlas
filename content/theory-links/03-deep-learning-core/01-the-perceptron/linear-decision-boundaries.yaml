card:
  title: 深度学习：感知机为何只能画出线性边界
  summary: 训练逻辑门并观察 XOR 失败时，把单个感知机看成线性分类器，才能从边界形状判断何时必须增加隐藏层。
  context: "本课用逻辑门检验感知机能力；XOR 的失败不是训练轮数不足，而是单个线性决策边界的表达限制。"
  intuition: "感知机先用一个超平面把空间切成两半，再按打分符号分类；一刀能分开的模式可学，一刀分不开的模式则需要组合多个边界。"
  key_points:
    - "感知机打分为 w·x+b，等于零的点构成决策边界，w 是该超平面的法向量。"
    - "当正负样本可被一个超平面完全分开时称为线性可分，AND 与 OR 可满足这一条件。"
    - "XOR 的同类点位于对角位置，任何单一直线都会混入另一类，因此需要隐藏层和非线性组合。"
  application: "画出逻辑门四个输入点和当前边界，训练后逐点检查打分；对 XOR 将失败归因于几何可分性而非盲目继续迭代。"
  check_question: "为什么给单个感知机增加更多训练数据或轮数，仍不能让一条直线正确分开标准 XOR 四个点？"
