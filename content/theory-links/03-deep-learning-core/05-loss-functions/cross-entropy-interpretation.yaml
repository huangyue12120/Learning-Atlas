card:
  title: 信息论：交叉熵如何衡量预测分布
  summary: 实现 softmax 的分类损失和标签平滑时，用编码真实标签的平均信息量解释交叉熵，而非只把它当作一个需背诵的公式。
  context: "本课要从 logits 实现多分类损失并加入标签平滑；目标不再只是类别索引，而是一个需要与预测分布比较的概率分布。"
  intuition: "softmax 给每类分配概率，交叉熵计算用这些概率编码目标分布的平均代价；把概率放错位置会付出额外比特代价。"
  key_points:
    - "softmax 将 logits 指数化并归一化为和为 1 的类别分布，共同平移 logits 不改变结果。"
    - "one-hot 目标下交叉熵等于真实类别概率的负对数，低概率错误受到更强惩罚。"
    - "标签平滑把少量质量分给非目标类，目标分布不再是完全确定的 one-hot 向量。"
  application: "用减最大值实现稳定 softmax，分别对 one-hot 和平滑标签求分布加权负对数，并检查每行概率和。"
  check_question: "标签平滑后，为什么损失不再只取真实类别那一个负对数项？"
