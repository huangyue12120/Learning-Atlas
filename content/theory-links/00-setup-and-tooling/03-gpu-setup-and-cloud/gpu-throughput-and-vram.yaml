card:
  title: GPU 吞吐与显存：为什么矩阵运算会加速
  summary: CPU 优先缩短单项任务延迟，GPU 优先并行吞吐；先区分算力和显存带宽，才能正确解读基准测试与 VRAM 容量限制。
  context: "本课会比较 CPU 与 GPU 的矩阵运算；只看总耗时而不了解两种处理器的设计目标，容易把传输、预热或显存限制误判为算力差异。"
  intuition: "GPU 的优势来自让大量相同计算并行推进；先问任务是否足够并行、数据是否已在设备上，再讨论加速比。"
  key_points:
    - "CPU 用较少而强的核心优化单线程延迟，GPU 用大量执行单元提高规则并行工作的吞吐。"
    - "显存容量决定能否容纳参数与中间张量，显存带宽决定这些数据被计算单元读取和写回的速度。"
    - "小矩阵或频繁的主机到设备传输可能盖过并行收益，因此基准测试必须明确计时边界。"
  application: "比较同形状运算时固定数据类型与设备，先预热并同步 GPU，分别记录计算时间、传输时间和显存占用。"
  check_question: "为什么一个能放入显存的小矩阵运算仍可能在 GPU 上比 CPU 慢？你会先检查哪两个开销？"
