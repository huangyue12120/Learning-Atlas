card:
  title: 数据划分：抽样决定评估能否代表真实表现
  summary: 训练、验证和测试集都应来自清楚界定的数据总体；随机种子让切分可复现，但代表性、独立性和覆盖范围仍决定评估是否可信。
  context: "本课要建立训练、验证和测试划分；如果样本没有代表部署总体或集合之间发生泄漏，后续指标即使稳定也不回答真实问题。"
  intuition: "先定义希望泛化到哪个总体，再设计能代表它且彼此独立的切分；随机种子只能重现方案，不能修正方案。"
  key_points:
    - "样本总体界定了评估结论可以推广到的对象，抽样框遗漏的群体不会被测试分数补回来。"
    - "验证集用于选择模型，测试集应留到选择完成后评估，避免把测试反馈间接用于训练。"
    - "时间、用户或实体相关样本需要按其依赖关系分组或排序切分，单纯逐行随机可能造成泄漏。"
  application: "在生成清单时记录总体、切分单位、比例与种子，并检查同一用户或近重复样本是否跨越不同集合。"
  check_question: "一个固定随机种子的逐行切分包含同一用户的相邻记录，它是可复现的；为什么评估仍可能过于乐观？"
