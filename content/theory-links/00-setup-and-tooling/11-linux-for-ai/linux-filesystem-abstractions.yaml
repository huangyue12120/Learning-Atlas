card:
  title: Linux 文件系统：路径、inode 与权限为何能协同工作
  summary: 文件名由目录映射到 inode；权限、挂载目录和虚拟文件系统共同决定训练数据、缓存、日志和设备信息在远程机器上的位置与可访问性。
  context: "训练数据、缓存、设备与日志分散在不同路径；只把路径当成普通字符串，会难以解释权限错误、挂载差异和同一文件的多个名称。"
  intuition: "沿路径逐级解析目录项，最终找到保存元数据与数据位置的 inode；访问结果还取决于挂载关系和进程权限。"
  key_points:
    - "目录把文件名映射到 inode，inode 保存类型、权限、所有者和数据块位置，而不保存该目录中的名称。"
    - "绝对路径从根目录解析，相对路径从当前工作目录解析，因此启动位置会改变相对路径含义。"
    - "挂载把另一个文件系统接入目录树，虚拟文件系统也能用文件接口暴露进程和设备状态。"
  application: "为本课数据与缓存使用明确路径，借助权限和挂载检查定位不可访问文件，并避免依赖不确定的当前目录。"
  check_question: "两个路径若通过硬链接指向同一 inode，修改其中一个路径的文件内容后，另一个路径会看到什么？"
