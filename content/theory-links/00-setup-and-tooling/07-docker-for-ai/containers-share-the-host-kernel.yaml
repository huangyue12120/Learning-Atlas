card:
  title: 容器：共享内核而不是复制一台机器
  summary: Docker 镜像固定运行环境；容器通过命名空间隔离可见资源、通过 cgroups 限制资源用量，因此比完整虚拟机更轻量且可复现。
  context: "AI 项目对系统库和运行时版本敏感；本课需要区分容器封装了哪些依赖，以及哪些能力仍由宿主机提供。"
  intuition: "把镜像看成可复现的用户空间，把容器看成受隔离和限额的宿主进程，而不是一台自带内核的小电脑。"
  key_points:
    - "镜像以分层文件系统固定应用、库和配置，容器是在该镜像上启动的可写运行实例。"
    - "命名空间隔离进程、网络和挂载等可见范围，cgroups 控制 CPU、内存等资源配额。"
    - "容器共享宿主内核，所以启动和资源开销通常低于包含独立客户机内核的虚拟机。"
  application: "为本课环境固定基础镜像和依赖版本，把数据与产物通过挂载传入，并在资源限制下验证同一命令可重复运行。"
  check_question: "若镜像内用户空间完全相同，但宿主内核或硬件能力不满足要求，容器为什么仍可能运行失败？"
