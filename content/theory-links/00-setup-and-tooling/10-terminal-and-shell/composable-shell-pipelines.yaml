card:
  title: Shell 管道：把小命令组合成可检查的数据流
  summary: 管道把前一命令的标准输出交给下一命令，重定向则把输出保存为文件；理解这一输入输出模型，才能可靠地筛选训练日志并保留诊断证据。
  context: "本课用多个命令筛选和保存日志；只有明确标准输入、标准输出与错误输出的去向，组合后的结果才可检查。"
  intuition: "把每条命令看成一个只做一次转换的节点：管道连接节点，重定向选择数据最终落到终端还是文件。"
  key_points:
    - "管道把左侧命令的标准输出作为右侧命令的标准输入，不会默认传递标准错误。"
    - "输出重定向可以新建或覆盖文件，追加重定向则保留已有内容并写到末尾。"
    - "小命令拥有清楚的文本输入输出约定时，筛选、排序和汇总步骤才能可靠组合。"
  application: "先单独验证每个日志处理命令，再逐段连接管道，并把需要审计的最终结果与错误流有意保存。"
  check_question: "某命令把报错写到标准错误，而你只对标准输出做管道和重定向；结果文件中会缺少什么信息？"
