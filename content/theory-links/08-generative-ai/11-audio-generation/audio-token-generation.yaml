card:
  title: 音频编解码词元上的自回归生成
  summary: 在训练风格条件下一词元预测器时，用跨模态生成笔记核对 AudioLM 与 MusicGen 如何把高采样率波形压缩成离散音频词元，再以语言建模方式生成长序列。
  context: "直接对高采样率波形逐点建模会产生极长序列，本课需要先把语义与声学细节压缩到可预测的离散代码，再保持多码本的时间关系。"
  intuition: "神经编解码器把连续声音写成紧凑乐谱，Transformer 只负责续写代码，解码器再把代码演奏回波形。"
  key_points:
    - "神经音频编解码器先压缩波形，再用残差向量量化把每个时间步表示成多级离散码本索引。"
    - "AudioLM 分层生成高层语义 token 与细粒度声学 token，使内容规划和音色细节分工。"
    - "MusicGen 用单个自回归 Transformer 按交错码本模式预测多级音频 token，并可由文本 embedding 条件控制。"
  application: "在本课生成器中核对时间步与码本轴的展开顺序，比较关闭风格条件或打乱码本偏移后对长程结构和音色的影响。"
  check_question: "为什么只生成高层语义 token 通常不足以还原说话者音色和录音细节？"
