card:
  title: 高斯潜变量与重参数化采样
  summary: 在编写 z=μ+σ·ε 和标准正态先验采样时，用概率分布笔记复核高斯分布的均值、方差与标准化关系，建立从分布参数到可微样本的直觉。
  context: "VAE 编码器输出的是分布参数而非一个固定编码；本课必须在保留随机采样的同时，让重建损失仍能更新 μ 与 σ。"
  intuition: "把不可控的随机性统一放进标准正态 ε，再由可微的平移和缩放把它变成所需高斯样本。"
  key_points:
    - "标准正态 ε 的均值为 0、方差为 1，z=μ+σ·ε 因而具有均值 μ、方差 σ²。"
    - "编码器通常输出 μ 与 log σ²；由后者还原 σ 可确保尺度为正并允许无约束网络输出。"
    - "随机变量 ε 与模型参数无关，所以给定 ε 后，z 对 μ、σ 是确定且可微的。"
  application: "固定 μ、σ 重复采样核对经验均值与方差，再对一次重建损失反传，确认 μ 和 log σ² 都得到有限梯度。"
  check_question: "为什么直接把采样操作写成 z∼N(μ,σ²) 不便于反向传播，而 z=μ+σ·ε 可以？"
