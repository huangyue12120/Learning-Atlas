card:
  title: 视频扩散中的空间与时间建模
  summary: 在把视频图块送入时空 DiT 并测试帧间连贯性时，用跨模态生成笔记核对空间层负责外观、时间层负责运动的分解，以及长片段必须保持的身份与物理一致性。
  context: "逐帧生成可以让每张图清晰，却无法保证物体身份、位置和运动连续；本课必须让模型显式交换跨时间证据，同时控制庞大的图块成本。"
  intuition: "空间注意力回答一帧里有什么，时间注意力追踪同一位置随帧怎样变化；交替两者比让所有时空图块全连接更可承受。"
  key_points:
    - "3D VAE 先把视频压缩为 T×H×W 潜变量，再切成带时间、纵向和横向位置的时空 patch。"
    - "分解注意力在帧内建模外观、在对应空间位置跨帧建模运动，避免完整 3D 注意力的高昂成本。"
    - "视频质量不仅取决于单帧清晰度，还取决于身份、运动和场景状态在长片段中的一致性。"
  application: "用移动物体合成序列分别测试逐帧外观误差与跨帧轨迹误差，再比较关闭时间注意力前后的身份和运动连贯性。"
  check_question: "为什么把一个高质量图像扩散模型独立应用到每一帧，仍容易产生闪烁和身份漂移？"
