card:
  title: 生成模型家族的目标与取舍
  summary: 使用视觉生成理论笔记中的 GAN、VAE、扩散、得分模型与流匹配定义，核对本课五问分类法里的密度表示、训练目标和采样路径，避免只按模型名称归类。
  context: "本课需要建立能迁移到新论文的分类法；只记模型名称无法判断它究竟优化什么、如何采样以及成本来自哪里。"
  intuition: "面对任一生成模型，先追问它表示什么对象、是否显式描述密度、训练信号是什么、从噪声到样本走哪条路，再看条件与评测。"
  key_points:
    - "自回归模型与可逆流具有可求值的显式密度，但前者采样串行，后者受可逆结构约束。"
    - "VAE 优化概率下界，扩散通过逐步加噪与反向去噪学习生成，二者都使用可计算的近似训练目标。"
    - "GAN 直接训练生成器与判别器而不求密度；得分模型学习对数密度梯度，流匹配学习连续速度场。"
    - "离散词元生成通常先用 VQ 类分词器压缩高维数据，再用自回归模型预测代码序列。"
  application: "对本课每个家族填写五问表，并用训练目标、采样步数和表示空间解释其速度、稳定性与可控性取舍。"
  check_question: "一个模型先把图像量化为离散代码，再逐代码预测，它在密度与表示两个维度上应如何归类？"
