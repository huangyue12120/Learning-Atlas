card:
  title: SDEdit 噪声强度与编辑保真度
  summary: 在选择起始时间 t/T 并比较保真度与改动幅度时，用跨模态生成笔记把前向加噪保留的原始信号比例与反向条件采样联系起来。
  context: "本课需要在不重新训练编辑模型的情况下控制保留原图多少、让新提示改动多少；起始噪声级别就是决定这项取舍的主要旋钮。"
  intuition: "先有意擦掉原图的一部分细节，再让条件去噪器按新提示补回来；擦得越多，创作自由越大，原图约束越弱。"
  key_points:
    - "SDEdit 将源图沿前向扩散过程推进到中间时刻 t₀，再从该状态按新条件运行反向采样。"
    - "t₀ 较小时 α̅_t₀ 保留更多原始信号，适合颜色或风格微调；t₀ 较大时可改变对象与布局。"
    - "该方法复用已经训练好的扩散模型，不要求专门的掩码输入或编辑训练集。"
  application: "固定源图、提示和随机种子，仅扫描 t₀，成对记录与源图的相似度及提示符合度，找出任务需要的折中点。"
  check_question: "将 t₀ 提高到接近总扩散步数时，为什么新图通常更符合提示却更难保留源图结构？"
