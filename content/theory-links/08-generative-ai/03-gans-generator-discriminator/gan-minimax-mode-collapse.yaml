card:
  title: GAN 极小极大目标与模式坍塌
  summary: 在交替更新生成器与判别器、观察非饱和损失和模式坍塌时，用视觉生成理论笔记核对极小极大目标、均衡条件及稳定化方法所针对的失效原因。
  context: "本课的生成器和判别器会同时改变彼此的训练目标；单看某个损失下降无法判断是逼近数据分布，还是一方暂时压倒另一方。"
  intuition: "判别器不断指出赝品破绽，生成器沿反馈修补；理想均衡不是谁获胜，而是生成分布覆盖真实分布后判别器只能猜 0.5。"
  key_points:
    - "判别器同时区分真实样本与 G(z)，生成器常用 −log D(G(z)) 的非饱和目标避免判别器很强时梯度消失。"
    - "当生成分布等于数据分布时，最优判别器无法区分两者并在各处输出 0.5。"
    - "模式坍塌表示生成器只覆盖少数能骗过判别器的模式，即使个别样本看起来清晰，整体多样性仍不足。"
  application: "交替更新时同时画出两方损失、判别分数与各真实模式的生成覆盖率，用覆盖率而非单张样本识别模式坍塌。"
  check_question: "判别器很快接近完美而生成器梯度接近零时，为什么这不代表 GAN 已训练成功？"
