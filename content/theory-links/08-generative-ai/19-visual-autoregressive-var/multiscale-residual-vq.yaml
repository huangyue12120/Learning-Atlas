card:
  title: 多尺度残差 VQ 与粗到细图像词元
  summary: 在设计 VAR 分词器的共享码本、尺度金字塔和残差求和解码时，用图像分词理论笔记核对残差量化如何让低尺度编码全局结构、高尺度补充细节，并避免光栅顺序偏差。
  context: "VAR 不按像素光栅逐个生成，而是逐尺度完善整幅图；分词器必须让每层代码只表达前面尺度尚未解释的内容。"
  intuition: "先用极少 token 画出全局草图，再把每一尺度的量化残差当作修订层，逐步补上轮廓、局部结构和纹理。"
  key_points:
    - "多尺度分词器在从 1×1 到高分辨率的网格上使用共享码本，所有尺度 embedding 上采样后相加重建潜变量。"
    - "尺度 k 量化的是先前尺度重建后的剩余误差，因此低尺度承担全局结构，高尺度集中表达细节。"
    - "生成模型按尺度因果地预测下一网格，可在同一尺度内并行预测位置，减少纯光栅顺序的长依赖。"
  application: "逐尺度记录残差范数与重建误差，验证加入新尺度后细节改善；再检查注意力掩码只允许读取已生成尺度。"
  check_question: "为什么高分辨率尺度应量化前面尺度的残差，而不是独立重新编码整幅潜变量？"
