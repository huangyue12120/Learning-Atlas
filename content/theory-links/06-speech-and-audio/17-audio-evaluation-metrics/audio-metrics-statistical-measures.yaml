card:
  title: 音频指标的尺度、分布与工作点
  summary: 在为 ASR、TTS、说话人和流式系统选择 WER、MOS、EER 与延迟分位数时，用统计测度笔记判断每个指标的尺度、聚合方式和分布摘要是否匹配实际决策。
  context: "音频系统同时优化识别、自然度、安全和延迟；本课若把不同尺度的指标压成一个均值，会掩盖尾部风险和工作点权衡。"
  intuition: "先问每个指标测量什么对象、方向是好还是坏、分布是否偏斜，再选择均值、分位数或阈值曲线做摘要。"
  key_points:
    - "WER 是编辑错误数除以参考词数，越低越好；聚合时应区分按总词数微平均与按句平均。"
    - "MOS 来自主观等级评分，应同时报告样本与评审不确定性；EER 则是验证分数阈值曲线上的一个工作点。"
    - "实时延迟常呈长尾，p50 描述典型体验，p95 或 p99 才能暴露少数严重卡顿。"
  application: "为每项指标写清单位、聚合权重和优化方向，同时报告逐样本分布、置信信息及延迟多个分位数。"
  check_question: "两个系统平均延迟相同，但其中一个 p99 高得多；为什么用户体验风险仍不等价？"
