card:
  title: 内容、说话人与韵律的条件分解
  summary: 在交换说话人嵌入而保留文本或源语音内容时，用语音合成理论笔记区分内容表示、说话人条件与波形生成，避免把身份相似度误当成内容正确性。
  context: "声音克隆和转换希望改变身份而保留所说内容；本课需要把身份、语义和韵律的评价拆开，否则一个高相似样本仍可能说错话。"
  intuition: "把输出看成内容骨架加说话人条件和韵律条件，再由生成器合成；替换其中一项时，其余项应尽量保持。"
  key_points:
    - "内容表示承载音素或语言信息，说话人嵌入提供身份特征，韵律描述时长、音高和能量变化。"
    - "voice conversion 从源语音提取内容并更换说话人条件，voice cloning 可用少量目标语音估计身份条件。"
    - "说话人余弦相似度只测身份表示接近程度，还需用 ASR、韵律和自然度指标检查其他维度。"
  application: "固定文本交换说话人嵌入，再固定说话人改变文本；分别记录身份相似度、转写正确性和韵律差异。"
  check_question: "生成音频与目标说话人的嵌入非常相似，但 ASR 转写错误，这次克隆能算内容正确吗？"
