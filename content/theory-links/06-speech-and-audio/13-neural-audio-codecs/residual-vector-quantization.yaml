card:
  title: 残差向量量化与码本预算
  summary: 在增加 RVQ 码本并比较重建误差、比特率与语言模型序列长度时，用量化理论笔记理解离散表示误差、码本容量和计算成本之间的取舍。
  context: "神经音频模型需要把连续潜变量变成有限离散词元；本课增加码本会改善重建，却同时增加传输和生成负担。"
  intuition: "第一个码本近似原向量，后续码本只量化尚未解释的残差；每多一级都细化重建，但要多发送一串索引。"
  key_points:
    - "向量量化用最近码本向量替代连续表示，误差是原向量与所选码字的差。"
    - "RVQ 逐级量化前一级残差，最终重建是各级选中码字之和。"
    - "码本数量、每本大小和帧率共同决定比特率与离散 token 数，更多容量通常降低失真但提高成本。"
  application: "逐级记录残差范数和重建误差，同时按帧率与码本索引位数计算比特率，画出质量—成本曲线。"
  check_question: "若每个音频帧从使用 4 个码本增至 8 个码本，语言模型每帧需要预测的离散索引数量如何变化？"
