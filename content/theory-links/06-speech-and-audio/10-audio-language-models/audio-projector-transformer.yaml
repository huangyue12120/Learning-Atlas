card:
  title: 音频编码器、投影器与语言模型接口
  summary: 在实现两层投影器并分阶段冻结或微调组件时，用 Transformer 与语言模型笔记理解音频特征如何进入词元嵌入空间，以及投影适配与序列建模的职责边界。
  context: "预训练音频编码器与语言模型的特征维度和表示语义不同；本课需要一个明确接口把声学帧变成语言模型可消费的序列。"
  intuition: "音频编码器负责听，投影器负责翻译表示坐标，语言模型负责在统一序列中推理和生成；每层只解决自己的边界问题。"
  key_points:
    - "音频编码器将波形或频谱压成帧级隐藏状态，序列长度由其时间下采样决定。"
    - "投影器把音频隐藏维映射到语言模型嵌入维，但不会自动完成长程序列建模。"
    - "先冻结两端训练投影器可建立接口，再按数据和目标选择性解冻，降低初期破坏预训练表示的风险。"
  application: "断言编码器输出、两层 projector 和语言模型输入的 batch、time、hidden 维度，并比较分阶段解冻的验证曲线。"
  check_question: "如果投影器输出维度与语言模型 token embedding 维度不一致，接口会在哪个运算处失败？"
