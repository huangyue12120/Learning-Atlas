card:
  title: 距离度量：KNN 的“邻近”由什么决定
  summary: 实现欧氏、曼哈顿和余弦距离并进行特征缩放时，用度量的性质判断何时两个样本才可被当作可比较的近邻。
  context: "KNN 不学习显式决策边界，而是完全依赖距离排序；尺度或度量选择不当会让某些特征无意中支配所有邻居。"
  intuition: "距离函数定义了空间里的地形，特征缩放决定每条坐标轴的单位；邻近关系是两者共同产生的。"
  key_points:
    - "欧氏距离强调平方和的直线长度，曼哈顿距离累加逐轴位移，二者都由相应范数定义。"
    - "余弦比较向量方向并弱化整体长度，更适合长度不代表强度的表示。"
    - "数值范围大的特征会主导基于坐标差的距离，因此缩放参数必须只从训练数据估计。"
  application: "对同一查询分别计算三种距离，在缩放前后列出最近邻与预测结果，并解释发生变化的坐标贡献。"
  check_question: "年龄取值约为几十、收入取值约为几十万时，未经缩放的欧氏 KNN 可能主要按哪个特征选邻居？"
