card:
  title: 经典机器学习：拆开泛化误差来定位问题
  summary: 计算自助采样下的偏差和方差时，先把拟合不足、对数据扰动敏感与不可约噪声分开，才能据此选择复杂度或正则化。
  context: "验证误差高可能来自模型过于简单，也可能来自对训练样本过度敏感；本课需要用重采样把两类问题分开。"
  intuition: "在许多相似训练集上重复拟合：平均预测偏离真实规律是偏差，不同拟合之间摇摆的程度是方差。"
  key_points:
    - "高偏差表现为训练和验证都拟合不足，增加模型表达能力通常比继续正则化更有针对性。"
    - "高方差表现为训练拟合很好但验证不稳，可通过更多数据、正则化或降低复杂度缓解。"
    - "不可约噪声来自输入未包含的信息或观测随机性，单靠更换模型无法消除。"
  application: "对多个 bootstrap 训练集拟合同一输入点，计算平均预测及其波动，再结合训练误差判断应调复杂度还是正则化。"
  check_question: "模型在所有重采样训练集上都给出几乎相同但系统性错误的预测，这更像高偏差还是高方差？"
