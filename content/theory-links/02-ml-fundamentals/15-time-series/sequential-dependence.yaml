card:
  title: 序列模型：相邻观测为何不能随机打乱
  summary: 构造滞后特征、观察自相关并进行滚动验证时，用序列依赖的观点判断哪些过去信息可用于预测而不窥视未来。
  context: "时间序列样本之间存在顺序依赖；本课若像普通表格那样随机切分，训练集可能包含验证时刻之后的信息。"
  intuition: "预测时站在时间轴上的当前点，只允许向左看；验证也要重演这种信息边界，而不是把未来随机混进训练。"
  key_points:
    - "滞后特征使用过去观测预测当前或未来值，构造后会在序列开头产生缺失位置。"
    - "自相关衡量序列与其滞后副本的线性关联，可提示周期或持续性但不自动证明因果。"
    - "滚动或扩展窗口按时间先后训练与验证，避免随机 K 折破坏顺序和泄漏未来。"
  application: "按时间排序后构造只使用过去的滞后列，用多个前向窗口评估，并检查任何特征的时间戳都不晚于预测时刻。"
  check_question: "用明天的销量参与标准化今天的特征，即使没有直接把明天销量作为输入，为什么仍是未来泄漏？"
