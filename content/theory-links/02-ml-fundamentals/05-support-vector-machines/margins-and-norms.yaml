card:
  title: 范数与距离：间隔为何需要归一化
  summary: 计算分类超平面间隔时，用向量范数区分原始打分与到决策边界的几何距离，避免把缩放后的权重误当成更大间隔。
  context: "本课要寻找最大间隔超平面；原始分数会随权重整体缩放而改变，因此不能直接代表样本到边界的几何距离。"
  intuition: "w 决定边界的法向方向，除以 ‖w‖ 才把代数打分换算成沿单位法向量测得的真实距离。"
  key_points:
    - "决策边界由 w·x+b=0 定义，点的有符号几何距离为 (w·x+b)/‖w‖₂。"
    - "同时把 w 与 b 乘同一正数不会改变边界，却会放大原始打分，所以间隔必须按范数归一化。"
    - "离边界最近的训练点成为支持向量，它们决定可实现的最大间隔。"
  application: "计算每个样本的归一化有符号距离，找出最小间隔样本，并验证整体缩放 w、b 后几何距离不变。"
  check_question: "把 w 和 b 同时乘以 10 后，分类边界、原始打分和归一化距离分别怎样变化？"
