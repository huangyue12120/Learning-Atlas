card:
  title: 贝叶斯方法：从先验与证据计算类别后验
  summary: 实现朴素贝叶斯预测与对数空间计算时，用条件概率、先验和后验的分解核对每一项概率为何可以相加或相乘。
  context: "本课要组合许多特征似然；直接相乘会快速下溢，而条件独立假设决定了这种分解是否成立。"
  intuition: "对每个类别从先验出发，逐个累积观察到这些特征的证据；转入对数空间后，概率乘积变成稳定的加法。"
  key_points:
    - "分类后验与类别先验乘以该类别下的特征联合似然成正比，预测时可比较未归一化分数。"
    - "朴素假设认为给定类别后各特征条件独立，因此联合似然分解为单特征似然乘积。"
    - "取对数后乘积变为求和；平滑可避免未见事件给出零概率并使整类得分归零。"
  application: "分别估计类别先验与条件分布，在 log 空间累加每项证据，并用 log-sum-exp 需要时恢复归一化后验。"
  check_question: "若某类别下一个词的估计概率为零，朴素乘积会对整条文本的类别得分造成什么影响，平滑如何改变它？"
