card:
  title: 信息熵：用不确定性挑选树的切分
  summary: 在枚举候选切分并计算熵或基尼不纯度时，借助信息量理解为什么纯度提升可作为切分质量的信号。
  context: "决策树必须在许多特征与阈值中选择一次切分；只比较子节点是否看起来更整齐，无法形成一致的选择规则。"
  intuition: "把节点标签分布视为不确定性：好切分让样本进入更纯的子节点，从而减少知道标签所需的信息。"
  key_points:
    - "熵在单一类别节点为零，类别分布越均匀通常越高；基尼不纯度也在纯节点取零。"
    - "切分后的不纯度按子节点样本比例加权，不能让很小的纯子节点掩盖很大的混杂子节点。"
    - "信息增益等于父节点熵减去加权子节点熵，树选择增益更大的候选切分。"
  application: "枚举本课阈值时保存左右类别计数，分别算熵或基尼的加权下降，并用手算小例验证最佳阈值。"
  check_question: "一个切分产生 1 个纯样本和 99 个仍很混杂的样本，为什么不能只因存在纯子节点就判它很好？"
