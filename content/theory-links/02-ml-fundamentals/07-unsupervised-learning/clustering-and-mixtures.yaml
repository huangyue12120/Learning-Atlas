card:
  title: 概率分布：把簇看作混合生成过程
  summary: 实现 GMM 的 EM 迭代时，把每个分量视为一个条件分布，才能正确理解责任度、均值与协方差更新的含义。
  context: "本课从硬聚类走向 GMM；同一点可能同时与多个簇相容，需要用概率而不是唯一标签表达归属不确定性。"
  intuition: "先随机选择一个隐藏分量，再从该分量的高斯分布生成样本；推断时则反过来计算每个分量对样本负责多少。"
  key_points:
    - "混合模型密度是各分量密度按混合权重的加权和，权重非负且总和为 1。"
    - "E 步用当前参数计算后验责任度，M 步以这些软权重重新估计混合权重、均值和协方差。"
    - "责任度对每个样本在所有分量上归一化为 1，因此表达软分配而非独立分数。"
  application: "实现每轮 E/M 步后检查责任度行和、混合权重和与协方差形状，并观察对数似然是否按预期改善。"
  check_question: "一个样本对两个分量的责任度分别为 0.8 和 0.2，这两个数在均值更新中各起什么作用？"
