card:
  title: 优化：把学习率调度当作搜索过程控制
  summary: 比较网格搜索、随机搜索和学习率调度时，先区分模型参数的优化轨迹与超参数搜索，避免用测试集反复挑选配置。
  context: "本课既搜索训练前设定的配置，又在训练过程中改变学习率；两者作用层级不同，却都必须避免借测试反馈调参。"
  intuition: "内层优化用梯度更新参数，外层搜索比较不同训练规则；学习率调度则控制内层每个阶段迈多大步。"
  key_points:
    - "模型参数由训练目标直接优化，学习率、正则强度和模型规模等超参数由外层验证结果选择。"
    - "网格搜索遍历预设组合，随机搜索从空间采样，在只有少数超参数重要时常能覆盖更多不同取值。"
    - "调度器按步数或验证信号改变学习率，但最终模型选择仍应基于验证集而非测试集。"
  application: "固定搜索空间和预算，在每个候选中只用训练折拟合、验证折比较，并记录学习率随训练步变化的轨迹。"
  check_question: "为什么用测试集选择最佳学习率后再报告同一个测试分数，会高估泛化表现？"
