card:
  title: 经典机器学习：从数据到可验证模型
  summary: 在搭建最近质心分类器和比较基线前，先把监督学习的输入、目标与评估对象对应起来。
  context: "本课从第一个分类器走完整个机器学习流程；若没有先定义输入、目标和评估数据，模型输出即使看似合理也无法验证。"
  intuition: "把学习看成从带答案样本中估计一条可复用规则，再用未参与拟合的数据检查这条规则能否推广。"
  key_points:
    - "监督学习样本由特征 X 与目标 y 配对，分类预测离散标签，回归预测连续数值。"
    - "训练过程从训练集估计模型参数，评估过程必须使用未被拟合步骤利用的数据。"
    - "简单基线提供最低参照；复杂模型只有在同一任务和指标上稳定优于基线才有意义。"
  application: "明确最近质心分类器的特征、类别与距离规则，先实现多数类基线，再在固定留出集上比较两者。"
  check_question: "若先查看测试集错误再修改特征，之后的测试分数还能被当作一次独立泛化评估吗？为什么？"
