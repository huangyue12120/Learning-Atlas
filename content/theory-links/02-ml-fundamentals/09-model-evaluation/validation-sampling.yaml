card:
  title: 抽样：交叉验证为何能估计泛化表现
  summary: 编写 K 折和分层 K 折时，利用抽样代表性理解折间波动的来源，并避免让类别分布或重复样本扭曲验证结论。
  context: "单次留出评估可能偶然容易或困难；本课通过多折重复训练，估计模型对不同样本划分的敏感程度。"
  intuition: "把数据轮流分成训练部分和未见部分，让每个样本恰好承担一次验证角色，再汇总多次泛化结果。"
  key_points:
    - "K 折交叉验证将数据分成 K 个互斥折，每轮用一折验证、其余折训练。"
    - "平均分数估计典型表现，折间离散程度揭示结论对样本划分的稳定性。"
    - "分层保持各折类别比例；有用户、群组或时间依赖时还需按相应单位切分以阻断泄漏。"
  application: "实现普通与分层 K 折，检查每个样本只进入一次验证集，并同时报告均值、波动与各折类别计数。"
  check_question: "少数类只有 10 个样本却随机分成 5 折时，为什么分层比普通随机分折更可靠？"
