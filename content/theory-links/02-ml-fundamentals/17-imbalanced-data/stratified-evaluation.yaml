card:
  title: 抽样：不平衡数据的验证集必须保留稀有类
  summary: 在重采样、类别权重和阈值调优之间比较时，用分层抽样确保验证折仍包含少数类，避免准确率掩盖实际的召回失败。
  context: "少数类样本稀缺时，普通随机切分可能让某折几乎没有正例；本课因此无法可靠比较重采样、权重或阈值策略。"
  intuition: "先让每个评估折保留原有类别构成，再只在训练部分处理不平衡；验证集要模拟真实分布而不是被人为平衡。"
  key_points:
    - "分层抽样按类别分别抽取，使各折类别比例更接近总体并降低少数类指标的偶然波动。"
    - "过采样或欠采样必须在切分之后仅作用于训练折，否则重复样本可能跨入验证集。"
    - "准确率可能被多数类主导，应结合少数类召回率、精确率及其阈值权衡。"
  application: "先生成分层训练验证索引，再在每个训练折内部应用重采样或类别权重，最后在原始验证分布上比较指标。"
  check_question: "若先复制少数类样本再随机切分，同一原始样本可能同时出现在哪两个集合中，会造成什么后果？"
