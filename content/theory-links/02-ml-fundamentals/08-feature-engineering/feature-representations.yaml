card:
  title: 经典机器学习：特征表示决定模型能看到什么
  summary: 组合数值变换、类别编码、文本特征和缺失值处理前，先用特征空间的观点检查每一步给模型增加或丢失了哪些可学习信号。
  context: "原始表格字段的尺度、类别和缺失语义各不相同；本课必须把它们转换为模型能够比较且训练部署一致的表示。"
  intuition: "特征管道是一副镜头：它决定哪些差异被放大、折叠或丢弃，模型只能学习镜头最终暴露的坐标。"
  key_points:
    - "数值缩放改变各维的相对尺度，类别编码把离散身份映射到数值列，二者不能混用同一语义假设。"
    - "缺失值处理需要区分未知、缺测与真实零值，必要时用缺失指示特征保留这一信号。"
    - "所有从数据估计的变换参数都应只在训练集拟合，再原样应用到验证、测试和部署输入。"
  application: "为每类字段指定变换并组成单一管道，记录输出列含义与维度，再用未见类别和缺失样本测试一致性。"
  check_question: "为什么先在全量数据上计算标准化均值，再做训练测试切分，会让模型间接看到测试集？"
