card:
  title: 互信息：筛选真正减少标签不确定性的特征
  summary: 实现离散互信息评分时，用“观察特征后标签的不确定性减少多少”来解释排序，而不是把相关性误当成信息量。
  context: "本课要在不先拟合复杂模型的情况下筛选特征；线性相关可能漏掉非线性依赖，也可能把编码尺度误当成关系强弱。"
  intuition: "比较看见特征前后对标签还剩多少不确定性；减少得越多，该特征提供的标签信息越多。"
  key_points:
    - "互信息可写成 I(X;Y)=H(Y)−H(Y|X)，也可由联合分布与边缘分布的比值计算。"
    - "X 与 Y 独立时互信息为零；互信息能捕捉一般统计依赖，不限于线性关系。"
    - "离散互信息依赖联合频数估计，样本稀少或分箱过细会让评分不稳定。"
  application: "从特征值与标签的列联表估计联合概率，手算互信息并排序，再只用训练集确定分箱和选择阈值。"
  check_question: "一个特征与标签呈确定的 U 形关系但线性相关接近零时，互信息可能仍然怎样，为什么？"
