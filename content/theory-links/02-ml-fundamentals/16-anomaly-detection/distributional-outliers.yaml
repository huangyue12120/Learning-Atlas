card:
  title: 概率分布：用位置与离散程度定义异常
  summary: 编写 Z 分数和 IQR 检测器时，先根据分布的中心与离散程度解释阈值，再决定离群点是否来自真正的异常而非尺度差异。
  context: "异常不是单纯的大数，而是相对参考分布不寻常的观测；本课需要选择与分布形状相匹配的中心和尺度。"
  intuition: "先建立正常数据的典型位置和散布，再把新点换算为离中心有多远；偏斜或重尾数据需要更稳健的尺子。"
  key_points:
    - "Z 分数用均值和标准差标准化距离，适合中心与尺度能代表数据的情形。"
    - "IQR 是第三四分位数与第一四分位数之差，基于中间一半数据，对极端值较不敏感。"
    - "阈值控制误报与漏报的权衡，统计离群只表示少见，不等同于业务上的错误或攻击。"
  application: "在同一数据上比较 Z 分数与 IQR 标记，画出分布和阈值，并用已知正常或异常样本校准工作点。"
  check_question: "少数极大值把均值和标准差同时拉高时，Z 分数检测为何可能漏掉它们，IQR 有何不同？"
