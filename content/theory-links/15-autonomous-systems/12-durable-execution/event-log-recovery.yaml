card:
  title: 事件日志、崩溃恢复与回放
  summary: 在把 LLM 调用与工具调用封装为可回放活动时，用文件系统日志在崩溃后重放或完成受保护状态转换的直觉，理解为何须先持久记录活动结果、再恢复工作流，而非重新执行副作用。
  context: "本课把长时智能体拆成活动、工作流和回放；需要用文件系统的持久性与状态边界避免崩溃后重复副作用。"
  intuition: "把不可逆的外部动作当作带记录的状态转换：先保存足够的事件，再用日志结果回放工作流，而不是盲目重做动作。"
  key_points:
    - "文件与事件日志是工作流恢复的耐久状态，不能只依赖进程内存。"
    - "活动结果被记录后，回放应读取缓存结果；未完成的活动才需要按策略重试。"
    - "thread_id 等稳定键把不同会话的状态分开，避免恢复时串写日志。"
  application: "为每个活动记录输入、开始和结果，模拟中途崩溃后验证已完成的工具调用只出现一次。"
  check_question: "为什么回放工作流时应复用已记录的活动结果，而不是再次执行原来的副作用？"
