card:
  title: 约束优化与多轴接受闸门
  summary: 在要求每次自我修改同时满足性能、安全、公平与稳健性时，用约束优化中“在可行域内优化目标”的视角区分硬约束与单一性能代理分数，并据此设计逐轴拒绝条件。
  context: "本课要求自我修改同时不降低安全、公平与稳健性；需要用约束优化表达性能目标和不可逾越的可行域。"
  intuition: "先把候选修改限制在满足所有硬约束的可行域，再在这个域内追求性能提升；单一总分不能替代边界检查。"
  key_points:
    - "约束优化把主目标与 g_i(x)≤c_i 等可行性条件分开。"
    - "硬约束一旦违反就拒绝候选，软偏好只能用于可行候选之间的排序。"
    - "Lagrange/KKT 条件说明约束边界会改变最优解，而不是事后补一个惩罚分。"
  application: "为性能、安全、公平和稳健性分别记录基线与容差，逐轴检查并在任一轴退化时拒绝提交。"
  check_question: "若候选修改性能分数上升但安全指标跌破硬阈值，约束优化流程应怎样处理？"
