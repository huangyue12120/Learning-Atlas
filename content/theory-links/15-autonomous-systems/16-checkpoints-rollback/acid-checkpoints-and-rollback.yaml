card:
  title: ACID 语义、检查点与回滚
  summary: 在崩溃恢复前检查余额等前置条件、验证副作用并触发回滚时，用事务原子性、一致性与耐久性理解为什么“已批准”不等于可安全重放，以及检查点后端必须保留可审计状态。
  context: "本课在检查点恢复时执行前置条件、验证和回滚；需要用数据库事务的 ACID 语义约束状态转换。"
  intuition: "检查点是可审计的事务边界：状态和副作用必须能从一个有效状态一致地走到下一个状态，并在失败时补偿。"
  key_points:
    - "原子性避免只写入部分状态；一致性要求约束在转换前后都成立。"
    - "隔离性减少并发恢复互相覆盖，持久性保证已提交检查点可跨崩溃读取。"
    - "幂等键和前置条件共同判断重试能否安全进行，已批准不等于可盲目重放。"
  application: "为每个转换设计提交顺序、前置条件、结果校验与补偿动作，并在崩溃测试中核对只执行一次。"
  check_question: "检查点已经持久化但外部动作结果未知时，为什么仍要先检查前置条件并验证结果？"
