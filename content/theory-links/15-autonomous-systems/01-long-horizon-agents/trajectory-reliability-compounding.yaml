card:
  title: 长轨迹可靠性与概率连乘
  summary: 在模拟每步失败率如何累积、并判断 70 步运行的端到端可靠性时，用概率论的独立事件乘法规则核对 `p^n` 近似，同时明确它依赖于独立性假设。
  context: "本课把每一步工具或判断的可靠性组合成长轨迹；需要用事件联合概率估算整条运行真正成功的机会。"
  intuition: "把每一步看成一次事件，若步骤独立，整条轨迹成功就是所有事件同时发生，因此概率会按步骤相乘而快速下降。"
  key_points:
    - "独立事件满足 P(A∩B)=P(A)·P(B)，才可直接使用 p^n 近似。"
    - "一般联合概率要按条件概率展开，后一步可能依赖此前的状态或错误。"
    - "链式法则把长序列写成逐步条件概率的乘积，能暴露独立性假设。"
  application: "先用 p^n 计算 70 步的基线，再在模拟中改变每步可靠性并说明相关失败会使该估算失真。"
  check_question: "每步可靠性为 0.99 且相互独立时，70 步全部成功的概率应如何计算？"
