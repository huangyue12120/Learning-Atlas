card:
  title: 自回归下一词元分布与 logit 屏蔽
  summary: 实现 `mask_logits` 时，从自回归模型的下一词元条件分布和 softmax 出发，理解把无效词元设为负无穷为何会在不改变有效候选相对分数的前提下重新归一化概率。
  context: "模型原始下一词元分布不知道外部语法约束；本课要在不重训模型的情况下，保证每步采样只从仍合法的候选中进行。"
  intuition: "语法状态先给出允许集合，把其他 logits 变成负无穷后再 softmax，相当于把原分布条件化到合法集合。"
  key_points:
    - "自回归模型根据已有前缀输出整个词表的下一词元 logits，softmax 将其归一化为条件分布。"
    - "无效候选的负无穷 logit 在 softmax 后概率为零，有效候选之间的 logit 差和相对排序保持不变。"
    - "约束器必须按生成前缀更新状态，并处理某一步没有任何合法词元的失败情况。"
  application: "为简单正则状态列出每步允许 token，应用 mask 后检查非法概率为零、有效概率和为 1，并覆盖死路前缀。"
  check_question: "屏蔽一个高分非法词元后，剩余有效词元的概率为何会增大，而它们之间的相对赔率仍不变？"
