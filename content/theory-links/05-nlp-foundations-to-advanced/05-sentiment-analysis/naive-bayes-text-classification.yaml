card:
  title: 经典分类：多项式朴素贝叶斯与拉普拉斯平滑
  summary: 实现情感分类器的类别先验、词条件概率与对数得分时，用生成式分类和加性平滑解释条件独立假设及零概率为何会破坏整条预测。
  context: "本课要从词计数直接构造情感分类器；任何未见词的零概率都会让整篇文档似然归零，因此估计方式决定模型是否可用。"
  intuition: "对每个类别先问它本来多常见，再累积该类别生成文档中每个词的证据；平滑为未见组合保留极小但非零的可能。"
  key_points:
    - "多项式朴素贝叶斯以类别频率估计先验，以类别内词计数估计条件概率。"
    - "给定类别后假设词项贡献条件独立，文档似然因而是各词概率按词频相乘。"
    - "拉普拉斯平滑给每个词—类别计数加常数；在 log 空间中概率乘积转为加权求和。"
  application: "打印每类先验、平滑后的词概率和文档 log 得分，专门加入训练未见词检查结果不会变成负无穷。"
  check_question: "若某个正面测试句含一个从未在正面训练文档出现的词，未平滑模型的整句正面似然会怎样？"
