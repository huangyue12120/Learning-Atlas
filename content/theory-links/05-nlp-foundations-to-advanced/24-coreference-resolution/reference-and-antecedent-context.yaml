card:
  title: 共指：用语境连接代词与先行词
  summary: 实现代词消解器时，把共指理解为语用层的同实体指称，再用数的一致性、新近性和句法角色为候选先行词排序，解释规则基线为何能处理近距离代词却难以覆盖桥接与后指。
  context: "代词表面形式不携带完整实体身份；本课必须在上下文候选中恢复它指向谁，才能得到连贯的实体链。"
  intuition: "先用一致性排除不可能候选，再把新近、显著且句法上合适的提及排在前面；这些只是线索组合，不是单一确定规则。"
  key_points:
    - "共指链连接指向同一实体的多个 mention，先行词通常在代词之前但并非始终如此。"
    - "数、性或实体类型一致性可作为过滤条件，新近性和主语位置常作为排序特征。"
    - "桥接关系依赖关联而非同一实体，后指的解释对象出现在代词之后，简单向前规则难以覆盖。"
  application: "为每个代词生成前文候选，打印一致性过滤和排序分数，再用桥接与后指样例明确标记基线边界。"
  check_question: "候选与代词在数上匹配，为什么这仍不足以证明二者共指？还需要哪些上下文线索？"
