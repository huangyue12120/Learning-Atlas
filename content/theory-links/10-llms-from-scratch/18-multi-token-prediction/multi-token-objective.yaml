card:
  title: 自回归目标与多词元预测
  summary: 在推导 MTP 各预测深度的交叉熵、联合损失和因果链时，用高级文本生成笔记核对自回归语言模型的下一词元目标与训练信号；该关联先保留候选状态，因为理论笔记未专门讨论 DeepSeek-V3 的顺序式 MTP。
  context: "本课把一个位置的下一词元目标扩展到多个未来深度；必须先分清因果可见范围和每个深度的监督位置，才能正确组合交叉熵而不泄漏未来信息。"
  intuition: "自回归模型沿序列一步步预测下一个词元；多词元预测像在同一条因果链上再接几个预测头，每个头负责更远的一步并共享前面的表示。"
  key_points:
    - "因果语言模型用前缀条件化下一个词元，当前位置不能读取它要预测的未来目标。"
    - "每个预测深度都有自己的目标对齐和交叉熵，联合损失的权重会改变训练信号的相对强度。"
    - "更远深度的目标依赖连续的因果表示；实现时要检查移位、掩码和序列末端的有效样本数。"
    - "多词元目标可能改善训练或辅助解码，但不能把额外监督误解为一次前向就能无条件生成整段文本。"
  application: "为每个预测深度画出输入位置到目标位置的对齐，分别计算有效 token 数和交叉熵，再比较不同损失权重的训练曲线。"
  check_question: "为什么多词元预测的第 k 个目标仍必须遵守因果掩码，而不能直接读取这 k 个未来词元？"
