card:
  title: LLM 评测的指标、基准与不确定性
  summary: 在实现困惑度、成对比较、ELO 和自定义评测流水线时，用 ML 系统设计笔记核对离线/在线评测、样本质量、回归门禁和指标漂移之间的关系。
  context: "本课需要决定模型能否进入下一阶段，而不是只生成一张排行榜；通用基准、语言建模损失和真实任务质量测量的是不同对象。"
  intuition: "困惑度像基础健康检查，标准基准用于粗略横向比较，自定义评测才模拟实际工作；自动指标说不清的开放题再交给盲测偏好。"
  key_points:
    - "困惑度是平均负对数似然的指数，只能在相同 tokenizer 与测试集设置下公平比较，不能直接代表指令遵循。"
    - "公开基准便于复现但会受训练数据污染、针对性训练和分数饱和影响。"
    - "自定义评测应覆盖生产输入、失败切片与业务约束，并作为版本发布的回归门禁。"
    - "成对判断可聚合为 Bradley–Terry 或 Elo 分数，但必须报告样本设计、评审一致性与不确定性。"
  application: "固定版本化评测集、提示模板和随机种子，分切片报告分数与置信范围，并让新模型同时通过能力、延迟和安全回归门禁。"
  check_question: "若新模型困惑度下降但你的 SQL 自定义评测通过率下降，发布决策应优先相信哪项证据，为什么？"
