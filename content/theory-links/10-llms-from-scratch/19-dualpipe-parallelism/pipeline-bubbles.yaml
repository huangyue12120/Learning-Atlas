card:
  title: 流水线并行与气泡
  summary: 在跟踪 1F1B、Zero Bubble、DualPipe 的微批次调度、计算–通信重叠和 GPU 利用率时，用分布式深度学习笔记核对流水线并行的阶段划分与通信代价；该关联先保留候选状态，因为理论笔记未专门讨论 DualPipe。
  context: "本课要解释多张 GPU 为什么不一定能线性加速训练；阶段划分、微批次数量和前后向调度共同决定设备空闲时间与通信等待。"
  intuition: "流水线并行像装配线：每个阶段只持有部分层，微批次依次经过各阶段；填充和排空期间没有工作可做的时间就是气泡。"
  key_points:
    - "流水线并行把连续层分给不同设备，阶段之间只传递激活而不是复制完整模型。"
    - "微批次让多个输入同时处在不同阶段，能够减少等待，但会带来调度和激活保存的复杂性。"
    - "气泡来自流水线启动、排空和阶段速度不平衡；增加微批次通常能摊薄固定空闲比例。"
    - "计算与通信重叠可以提高利用率，但慢速互连和不均匀阶段仍会成为吞吐瓶颈。"
  application: "为 1F1B 和改进调度画出每个阶段的时间线，统计气泡比例、激活内存、通信等待和每微批次吞吐。"
  check_question: "为什么把一个 batch 切成更多微批次通常能减少流水线气泡，却也可能增加激活内存和调度开销？"
