card:
  title: 分布式训练的并行维度与内存账本
  summary: 在估算权重、梯度、优化器状态和激活值的显存，并比较数据、张量、流水线并行与 FSDP 时，用分布式深度学习笔记核对参数分片、通信代价和流水线气泡的关系。
  context: "本课选择并行策略前必须先知道哪一类状态放不进单卡；只按参数量估算会漏掉梯度、Adam 状态和随批量增长的激活。"
  intuition: "先给训练内存逐项记账，再决定切哪一维：数据并行切样本，张量并行切矩阵，流水线切层，FSDP 则切参数相关状态。"
  key_points:
    - "训练显存至少包含权重、梯度、优化器一阶与二阶状态及前向激活，精度和批量决定各项字节数。"
    - "数据并行复制完整模型与优化器状态，只分割批次并 all-reduce 梯度，因此提升吞吐但不解决模型本身装不下。"
    - "张量并行拆分层内矩阵并频繁聚合部分结果，依赖高速互联；流水线并行拆分层并以微批次减小空闲气泡。"
    - "FSDP 或 ZeRO 按设备分片参数、梯度或优化器状态，以通信换取更低的单卡常驻内存。"
  application: "用真实配置计算每项显存和通信量，先找最大瓶颈，再组合最少的并行维度，并把流水线气泡和互联带宽纳入可行性检查。"
  check_question: "为什么增加纯数据并行 GPU 数量，仍不能让一份 96 GB 的完整训练状态装进每张 80 GB GPU？"
