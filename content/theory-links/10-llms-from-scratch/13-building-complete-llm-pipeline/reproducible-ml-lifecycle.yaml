card:
  title: LLM 流水线的生命周期与可复现性
  summary: 在把数据、训练、评测、制品、成本和回滚组织成十二阶段流水线时，用 ML 系统设计笔记核对生命周期分层、模型注册、评测门禁、监控与反馈回路。
  context: "本课把前十二节输出连接成可发布系统；任何上游制品变化都可能使下游结果失效，没有来源链就无法复跑、比较或安全回滚。"
  intuition: "把每个阶段当成有签收单的工序：输入哈希、配方与环境决定输出，输出再成为下一工序唯一明确的输入。"
  key_points:
    - "ML 生命周期从问题、数据、训练和评测走向部署、监控与迭代，线上反馈会再次触发前面的决策。"
    - "运行 manifest 应记录代码提交、数据与配置版本、随机种子、输入输出哈希、成本和耗时。"
    - "阶段 N 的输出哈希成为 N+1 的输入证据；tokenizer 或数据变化应显式使依赖它的模型、评测和量化制品失效。"
    - "模型注册表保存版本、评测与阶段状态，发布门禁和线上监控共同决定晋级或回滚。"
  application: "从 manifest 重放一次小流水线并逐级核对哈希，再故意改变 tokenizer 输入，验证所有下游依赖被阻断而旧制品仍可回滚。"
  check_question: "为什么仅保存最终模型权重，而不保存 tokenizer、数据哈希和训练配置，不能称为可复现流水线？"
