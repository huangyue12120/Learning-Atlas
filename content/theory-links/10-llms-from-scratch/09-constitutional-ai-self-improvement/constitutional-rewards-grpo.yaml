card:
  title: 宪法式反馈、GRPO 与奖励塑形
  summary: 在把原则转成批评—修订循环、区分过程/结果奖励，并按组内均值构造 GRPO 优势时，用高级文本生成笔记核对偏好奖励、KL 约束和可验证反馈的作用边界。
  context: "本课要把自然语言原则变成可重复的数据与优化信号；原则若含糊、批评未引用原则或奖励不可验证，自改进循环只会放大原模型偏差。"
  intuition: "宪法是显式评审规约：模型先按条款找出响应问题并修订，再把同一规约产生的比较或可验证结果转成训练信号。"
  key_points:
    - "SL-CAI 对初始响应按选定原则生成批评与修订，并用提示—修订响应对继续监督微调。"
    - "RLAIF 让模型依据宪法比较成对响应，生成偏好数据后可用于奖励模型、PPO 或 DPO。"
    - "GRPO 对同一提示采样一组输出，以组内奖励均值或标准化结果构造优势，从而省去独立 critic。"
    - "过程奖励评估中间步骤，结果奖励只评估最终输出；可验证规则通常比开放式神经评分更不易被钻空子。"
  application: "为每条原则准备通过与违反样例，审计批评是否指向具体条款、修订是否真正消除问题，再比较过程与结果奖励对同一轨迹的区分。"
  check_question: "如果模型本身无法识别某类操纵性表达，为什么仅增加同一模型产生的宪法式批评数据未必能修复该盲点？"
