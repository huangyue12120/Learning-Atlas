card:
  title: 稀疏注意力与计算预算
  summary: 在比较局部窗口、全局 token、块稀疏模式和 NSA 的 token 选择时，用高效架构笔记核对注意力复杂度、稀疏注意力与长上下文内存的关系；该关联先保留候选状态，因为理论笔记未专门讨论 NSA。
  context: "本课要在长序列上减少注意力的二次成本，同时保留任务需要的远距离信息；稀疏模式的选择必须连同可见范围和跨层传播一起评估。"
  intuition: "稀疏注意力不是让 token 消失，而是为每个查询规定一组可访问的键；少算一些边可以省资源，但也可能切断一次更新能看到的上下文。"
  key_points:
    - "标准自注意力构造 n×n 的交互，时间和存储都会随序列长度呈二次增长。"
    - "窗口、步幅或随机模式只保留部分连接，可把复杂度降到与固定邻域或稀疏模式相关的规模。"
    - "滑动窗口的远距离信息要通过重叠窗口和多层逐步传播，有效感受野受层数与窗口大小共同限制。"
    - "全局 token 或跨设备的 Ring Attention 可以补回远程依赖，但会带来额外的内存、通信或路由成本。"
  application: "对同一长序列分别记录每种模式的连接数、峰值显存、吞吐和远距离任务准确率，再判断节省的计算是否值得信息损失。"
  check_question: "如果窗口大小固定而序列长度继续增长，为什么局部稀疏注意力的计算不会像全注意力那样二次增长？"
