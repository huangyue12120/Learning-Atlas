card:
  title: 梯度检查点与训练内存
  summary: 在决定检查点间隔、重计算代价、CPU offload 以及与 TP/PP/FP8 的组合时，用分布式深度学习笔记核对激活内存和通信/计算权衡；该关联先保留候选状态，因为理论笔记未专门讨论选择性激活重计算。
  context: "本课要在有限显存中训练更深或更长的模型；检查点只针对反向所需的激活内存，不能把它和参数、梯度、优化器状态或故障恢复混为一谈。"
  intuition: "前向时只保存少数边界激活，反向到达某段时再从最近边界重跑中间计算；用额外算力换取更小的常驻激活集合。"
  key_points:
    - "训练内存同时包含参数、梯度、优化器状态和激活；激活随 batch、序列长度和模型宽度变化。"
    - "检查点减少需要保存的中间激活，但反向阶段必须重计算被丢弃的部分，因此会增加计算时间。"
    - "检查点间隔越大通常节省更多激活内存，却会增加重计算量；最优点取决于层数和设备带宽。"
    - "与 TP、PP、混合精度或 CPU offload 组合时，还要把通信、数据搬运和同步等待计入预算。"
  application: "在固定模型和 batch 下扫描检查点间隔，分别记录峰值显存、每 step 时间、重计算比例和跨设备通信，再选择满足吞吐目标的配置。"
  check_question: "为什么梯度检查点能降低激活内存，却不能直接消除参数、梯度或 Adam 优化器状态占用？"
