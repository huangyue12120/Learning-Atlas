card:
  title: 将前缀缓存命中率转化为跨副本路由规则
  summary: 在为多区域副本选择 prefix-hash 路由、并权衡 TTFT 与网络 RTT 时，前缀缓存原理说明了缓存命中为何可以跳过 prefill，也界定了缓存局部性在区域边界和数据驻留之前才应优化的范围。
  context: "本课比较多区域的轮询、区域缓存感知和全局缓存感知路由，要求同时考虑副本状态和网络代价。"
  intuition: "命中已有前缀的副本可以跳过 prefill，但跨区 RTT 可能超过省下的计算时间。"
  key_points:
    - "路由器使用副本发出的 KV 事件和请求前缀 hash 做匹配。"
    - "2K 词元前缀命中可显著降低 TTFT，但远端 RTT 可能抵消收益。"
    - "灾备恢复还需验证权重、tokenizer 和量化配置完整。"
  application: "运行三种路由策略，比较命中率、TTFT P50/P99 和跨区费用，并改变 RTT 找出切换点。"
  check_question: "为什么全局缓存命中并不必然比区域内冷 prefill 更快？"
