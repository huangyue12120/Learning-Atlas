card:
  title: 用级联路由在成本与模型能力之间设定质量闸门
  summary: 在为简单请求选择廉价模型、并对低置信度或困难请求升级时，请求路由的级联和学习式分类机制说明了如何把难度信号转化为模型选择，同时用在线质量采样防止任务分布漂移导致静默退化。
  context: "本课用级联路由把简单请求送到廉价模型，把困难或低置信度请求升级到前沿模型。"
  intuition: "先做便宜的一次判断，再依据难度和自信度升级，可以把昂贵模型留给真正需要的请求。"
  key_points:
    - "任务类型、prompt 长度、困难集相似度和首轮自信度是四种核心信号。"
    - "级联通常增加约 1.2 倍中位延迟，升级请求还要支付第二次调用。"
    - "任务分布漂移会让廉价模型静默接收不适合的请求。"
  application: "改变困难请求比例和升级阈值，比较成本、质量损失、升级率与延迟。"
  check_question: "为什么廉价模型的路由漂移不能只靠季度离线评测发现？"
