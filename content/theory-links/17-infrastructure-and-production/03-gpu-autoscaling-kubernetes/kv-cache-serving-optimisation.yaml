card:
  title: 用 KV 缓存压力驱动 LLM 服务扩缩
  summary: vLLM 为 KV 缓存预留显存，因此原始 GPU 内存占用不能表示真实请求压力。理解 prefill/decode 与 KV 块的关系后，才能把活跃序列的 KV 缓存利用率作为 decode 副本的扩缩信号。
  context: "本课把扩缩容从节点和调度层推进到 vLLM 服务层，重点是识别 decode 请求的真实压力。"
  intuition: "prefill 更偏矩阵计算，decode 更偏权重与 KV 读取；KV 预算和活跃序列接近上限时，排队会先于 GPU duty cycle 暴露。"
  key_points:
    - "GPU duty cycle 可能在 KV 缓存已满且请求已排队时仍显得正常。"
    - "prefill 应关注队列深度，decode 应关注 KV cache utilization。"
    - "按角色拆分 HPA，才能避免一个池的信号掩盖另一个池的瓶颈。"
  application: "分别记录 prefill queue depth、decode 活跃序列和 KV 利用率，模拟突发流量并比较每种信号的扩缩反应。"
  check_question: "为什么 decode 副本的 KV 缓存压力比原始 GPU 利用率更适合作为扩缩信号？"
