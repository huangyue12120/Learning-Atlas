card:
  title: 矩阵运算：线性层如何变换输入
  summary: 先从矩阵与向量相乘的形状和方向入手，再理解神经网络层为何可以写成一次矩阵乘法。
  context: "本课要把特征向量送入线性层；如果只记乘法语法而不追踪输入、权重和输出的维度，就很难解释层在空间中做了什么。"
  intuition: "矩阵的每一行从输入坐标取一次加权和；把所有行同时计算，就得到输出空间中的新坐标。"
  key_points:
    - "一个 m×n 矩阵乘以 n 维向量会产生 m 维向量，内侧维度必须一致。"
    - "矩阵乘向量等价于按向量系数组合矩阵的列，也等价于每一行与输入做点积。"
    - "线性变换保持向量加法与标量乘法；神经网络中的偏置会把它扩展为仿射变换。"
  application: "在实现线性层时先标注输入、权重和输出 shape，手算一个小样本的行点积，再与数组运算结果核对。"
  check_question: "若输入有 4 个特征而线性层输出 3 个特征，权重矩阵应是什么形状，乘法的内侧维度在哪里对应？"
