card:
  title: 点积：把方向关系变成一个数
  summary: 通过两个向量的夹角理解点积的符号和大小，再连接到检索与注意力中的相似度计算。
  context: "本课需要用一个标量比较两个表示；若忽略向量长度与夹角对点积的共同影响，就会误读相似度分数。"
  intuition: "点积衡量一个向量沿另一个方向投影了多少：同向为正、正交为零、反向为负，长度会同时放大结果。"
  key_points:
    - "代数形式是对应坐标乘积之和，几何形式是两向量模长与夹角余弦的乘积。"
    - "点积为零表示非零向量正交，但较大的正值既可能来自更相似的方向，也可能来自更大的模长。"
    - "余弦相似度用两向量范数归一点积，从而主要比较方向而不是尺度。"
  application: "先手算两组向量的点积与范数，再比较原始点积和余弦相似度，判断检索分数是否受长度主导。"
  check_question: "两个方向完全相同但长度分别扩大 2 倍和 3 倍时，点积与余弦相似度会怎样变化？"
