card:
  title: 向量空间：AI 对象如何落在同一个空间里
  summary: 用向量加法、数乘与维度的直觉，理解词、图像和用户特征为何能用同一套数学语言表示。
  context: "词、图像或用户只有被编码为同一坐标体系中的向量后，才能安全地相加、缩放或比较；本课需要明确这种表示的结构。"
  intuition: "把特征维度看成一组坐标轴：对象变成坐标列表后，向量运算表达的是同一空间内的方向和位移关系。"
  key_points:
    - "向量空间对向量加法和标量乘法封闭，并满足零向量、逆元以及分配律等公理。"
    - "一组线性无关且能张成空间的向量构成基，基中向量的数量就是空间维度。"
    - "坐标依赖所选基，而同一个抽象向量可以在不同基下拥有不同的坐标表示。"
  application: "为本课表示明确每个坐标的含义与维度，验证待运算对象处于同一空间，再用小向量观察加法和缩放的几何效果。"
  check_question: "为什么一个 3 维图像特征向量不能在没有映射规则时直接与一个 5 维文本向量相加？"
