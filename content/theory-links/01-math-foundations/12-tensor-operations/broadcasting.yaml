card:
  title: 广播：矩阵逐元素运算的 shape 规则
  summary: 在为激活、bias、通道缩放和注意力准备张量 shape 前，先明确逐元素矩阵运算、形状匹配与广播的数学约束。
  context: "本课会把偏置或通道参数应用到批量张量；广播能省去显式复制，但错误的单例轴也可能让运算沿错误维度悄悄执行。"
  intuition: "从 shape 的末尾向前对齐；相同维度直接配对，长度为 1 的轴可以逻辑重复到另一侧的长度。"
  key_points:
    - "两个维度兼容的条件是长度相等，或至少一方长度为 1；缺失的前导维度按 1 处理。"
    - "输出在每个轴取兼容维度的较大长度，广播描述逻辑扩展，不要求先复制完整张量。"
    - "广播用于逐元素运算，并不会把 Hadamard 运算自动变成矩阵乘法。"
  application: "为批、序列、通道等轴写出名称，先手算广播后的目标 shape，再插入单例轴并用断言核对输出。"
  check_question: "形状为 (32, 10, 64) 的张量若要给每个通道乘一个 64 维缩放向量，缩放参数应怎样排列，为什么？"
