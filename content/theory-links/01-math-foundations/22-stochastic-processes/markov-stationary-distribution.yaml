card:
  title: 马尔可夫链：从转移矩阵到平稳分布
  summary: 在模拟天气链、以 P.T 的特征向量计算 pi，并将 MCMC 的目标理解为平稳分布前，建立 Markov property、transition matrix 与 pi*P=pi。
  context: "本课既要逐步模拟天气状态，也要直接求长期比例；两种方法只有在转移矩阵和概率向量约定一致时才能互相验证。"
  intuition: "转移矩阵描述从当前状态向下一状态分配概率；反复应用后若总体比例不再变化，就到达平稳分布。"
  key_points:
    - "Markov 性质表示给定当前状态后，下一状态不再依赖更早历史。"
    - "行随机转移矩阵每行概率和为 1；行概率向量按 pₜ₊₁=pₜP 演化。"
    - "平稳分布满足 πP=π，因此也可从 Pᵀ 的特征值 1 对应特征向量求得并归一化。"
  application: "验证转移矩阵行和后，从多个初始状态模拟长期频率，再与归一化特征向量解比较。"
  check_question: "为什么求 Pᵀ 的右特征向量可以得到满足 πP=π 的行向量 π？"
