card:
  title: 优化：从梯度方向到更新规则
  summary: 在实现 GD、动量和 Adam 的参数更新前，复习极值、凸性、梯度下降和二阶方法的共同数学框架。
  context: "本课会比较多种优化器；如果不拆开方向估计、步长和历史状态，就只能把更新公式当作互不相干的配方。"
  intuition: "所有一阶优化器都从梯度判断局部坡度，差别在于怎样平滑历史、缩放各坐标并决定实际步幅。"
  key_points:
    - "基础梯度下降沿负梯度更新；凸目标下局部最小值具有全局意义，但步长仍影响收敛。"
    - "动量累积过去梯度形成速度，可减弱来回振荡并延续方向一致的更新。"
    - "Adam 同时维护一阶与二阶梯度矩估计，对不同参数给出自适应尺度。"
  application: "用同一目标和初值运行 GD、动量与 Adam，记录轨迹、损失和更新量，把性能差异对应到各自状态变量。"
  check_question: "在狭长谷底中梯度横向正负反复变化、纵向较一致时，动量为什么可能比普通 GD 前进得更稳？"
