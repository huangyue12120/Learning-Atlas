card:
  title: 信息论：交叉熵为何是分类损失
  summary: 在实现分类交叉熵、KL 散度和困惑度前，先连接熵、编码代价与模型分布之间的数学关系。
  context: "本课要计算分类损失和困惑度；若只把公式视为数值技巧，就难以解释错误置信度为何受到更重惩罚。"
  intuition: "用模型分布设计编码，却按真实分布接收符号；交叉熵就是平均编码代价，给真实结果的概率越小，代价越大。"
  key_points:
    - "熵衡量真实分布自身的不确定性，交叉熵衡量用预测分布编码真实样本的期望代价。"
    - "交叉熵等于真实熵加 KL 散度，因此在真实分布固定时，最小化交叉熵也在缩小分布差异。"
    - "对 one-hot 标签，单样本交叉熵化为真实类别预测概率的负对数；困惑度是平均负对数似然的指数。"
  application: "从 logits 得到概率后，手算真实类别的负对数并与通用交叉熵核对，再用平均损失计算困惑度。"
  check_question: "模型把真实类别概率从 0.1 提高到 0.2，与从 0.8 提高到 0.9 相比，哪一次带来的交叉熵下降更大？"
