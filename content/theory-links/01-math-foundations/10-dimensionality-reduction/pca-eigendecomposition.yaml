card:
  title: PCA：协方差矩阵的特征分解
  summary: 在实现中心化、协方差、特征向量排序和主成分投影前，回顾对称矩阵分解怎样把最大方差方向显式化。
  context: "本课要压缩高维数据；若不先中心化并理解协方差的特征方向，选出的分量可能描述均值偏移而非主要变化。"
  intuition: "把点云旋转到互相正交的主轴上，再保留延展最宽的几个方向；这些方向正是协方差矩阵最大特征值对应的特征向量。"
  key_points:
    - "PCA 先从每个特征减去样本均值，再由中心化数据计算对称协方差矩阵。"
    - "协方差矩阵的特征向量给出正交主方向，特征值给出数据沿这些方向的方差。"
    - "按特征值从大到小保留前 k 个方向，可在 k 维空间投影，并以舍弃特征值衡量信息损失。"
  application: "实现中心化、协方差和特征分解后，对特征值排序并投影，检查主成分正交性与重建误差随 k 的变化。"
  check_question: "如果跳过中心化，第一主成分可能主要捕捉什么；这为何不一定是数据变化最大的方向？"
