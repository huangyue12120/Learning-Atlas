card:
  title: 范数与度量：从向量大小到相似性
  summary: 在实现 L1、L2、L∞ 与最近邻度量前，掌握范数、度量公理及由范数定义距离的基础。
  context: "本课用不同距离做最近邻比较；若不了解各范数如何聚合坐标差异，就无法解释同一数据为何得到不同邻居。"
  intuition: "先用范数测位移向量有多大，再把两点距离写成它们差向量的范数；范数选择决定空间中等距轮廓的形状。"
  key_points:
    - "范数满足非负与定值性、绝对齐次性和三角不等式，由此定义 d(x,y)=‖x−y‖。"
    - "L1 累加绝对坐标差，L2 计算欧氏长度，L∞ 只取最大的绝对坐标差。"
    - "合法度量还满足对称性、同一点距离为零以及三角不等式。"
  application: "对同一查询点计算 L1、L2 和 L∞ 距离并排序，画出或列出各坐标贡献，解释邻居次序为何变化。"
  check_question: "两点只在一个坐标上相差 5、其余坐标相同时，L1、L2 与 L∞ 距离分别是多少？"
