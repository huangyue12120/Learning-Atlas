card:
  title: 贝叶斯推断：从似然和先验到后验
  summary: 在实现医疗检测后验、朴素贝叶斯和 Beta 顺序更新前，追溯 MLE、MAP、先验正则化与完整后验的共同基础。
  context: "本课中的检测阳性和顺序观测都要求从结果反推原因；仅看似然会忽略原因原本有多常见。"
  intuition: "先验表达观测前的可信度，似然衡量各假设生成证据的能力；两者相乘并归一化后得到后验。"
  key_points:
    - "贝叶斯公式把 P(证据|假设) 与 P(假设) 结合，证据概率负责让所有后验概率归一化。"
    - "MLE 只最大化似然，MAP 最大化似然与先验的乘积，完整贝叶斯推断保留整个后验分布。"
    - "顺序推断可把当前后验作为下一批证据到来前的先验，逐步更新信念。"
  application: "先列出检测问题的先验、敏感度和假阳性率，再计算归一化后验；对 Beta 更新逐批检查参数累加。"
  check_question: "一种疾病非常罕见时，即使检测敏感度很高，阳性后的患病概率为何仍可能不高？"
