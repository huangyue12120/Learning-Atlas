card:
  title: 微分：用局部斜率衡量权重变化
  summary: 在实现中心差分和解析导数前，先把极限、切线和瞬时变化率连到损失函数的局部变化。
  context: "本课用数值差分检查解析导数；只有把导数理解为局部变化率，才能选择合适步长并解释近似误差。"
  intuition: "在足够小的邻域里，用切线代替曲线；导数就是输入微小变化时输出一阶变化的比例。"
  key_points:
    - "导数由差商在步长趋近零时的极限定义，并给出曲线在该点的切线斜率。"
    - "局部线性近似写成输出变化约等于导数乘输入变化，只在邻域足够小时可靠。"
    - "中心差分同时采样点的两侧，通常比同样步长的单边差分更好地抵消一阶截断误差。"
  application: "为简单损失写出解析导数，用多个递减步长计算中心差分，观察近似先收敛、再受浮点误差影响的过程。"
  check_question: "某点导数为负时，把输入略微增大，函数值的一阶近似会怎样变化？"
