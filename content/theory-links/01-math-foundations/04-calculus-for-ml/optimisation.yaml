card:
  title: 优化：把梯度变成一次可控的参数更新
  summary: 在运行梯度下降和线性回归更新前，先理解学习率、局部近似与最小化目标的关系。
  context: "本课会反复更新回归参数；知道梯度方向还不够，步长决定局部下降是否转化为实际的损失下降。"
  intuition: "梯度提供局部坡度，沿负梯度迈一小步通常下坡；学习率控制对这张局部地图信任多远。"
  key_points:
    - "梯度为零是可微函数内部极值的必要条件，但该点也可能是最大值或鞍点。"
    - "梯度下降按参数减去学习率乘梯度更新，学习率过大可能越过低谷，过小则收敛缓慢。"
    - "凸目标的任意局部最小值也是全局最小值，非凸目标通常没有这一保证。"
  application: "在本课线性回归循环中记录每步损失和梯度范数，比较多个学习率，并在损失上升时缩小步长。"
  check_question: "如果一次更新后的损失反而显著增大，负梯度方向是否一定错了，还是还应检查什么？"
