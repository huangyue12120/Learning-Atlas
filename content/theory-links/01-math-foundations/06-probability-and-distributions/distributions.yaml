card:
  title: 概率分布：区分离散质量与连续密度
  summary: 在实现 Bernoulli、Poisson、均匀和正态函数前，先区分 PMF 的单点概率与 PDF 的区间积分。
  context: "本课同时实现离散与连续分布；若把概率质量和概率密度当成同一种量，归一化与事件概率都会算错。"
  intuition: "离散变量把概率放在一个个点上，连续变量把概率铺成曲线；连续事件的概率来自曲线下的面积。"
  key_points:
    - "离散分布的 PMF 在所有可能取值上的和为 1，单点函数值就是该点概率。"
    - "连续分布的 PDF 在全域积分为 1，区间概率是密度在该区间的积分，单点概率为零。"
    - "Bernoulli 与 Poisson 描述离散结果，均匀与正态密度描述连续结果，各自参数控制形状或位置尺度。"
  application: "实现每个函数后，对 PMF 求和或对 PDF 做数值积分，并用区间概率而不是单点密度解释连续样本。"
  check_question: "正态 PDF 在均值处的数值为什么可以大于某个区间的概率，却不能被直接称为该点概率？"
