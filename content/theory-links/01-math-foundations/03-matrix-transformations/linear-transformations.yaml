card:
  title: 线性变换：矩阵的列为何决定整个空间
  summary: 在实现旋转、缩放和反射前，先用标准基的像理解矩阵如何定义线性变换。
  context: "本课要从矩阵实现旋转、缩放和反射；逐点记公式不如理解矩阵如何由少数基向量决定整个空间的动作。"
  intuition: "先观察标准基被送到哪里；任意向量都是标准基的线性组合，因此它的输出也由同样系数组合这些列得到。"
  key_points:
    - "线性变换满足加法保持与数乘保持，因此必然把零向量映射到零向量。"
    - "矩阵的第 j 列就是第 j 个标准基向量经过变换后的像。"
    - "连续应用两个线性变换对应矩阵乘法，乘法顺序与实际应用顺序相反。"
  application: "先写出标准基经过目标旋转、缩放或反射后的向量，把它们作为矩阵列，再用测试点验证几何效果。"
  check_question: "如果二维变换把 e₁ 映到 (0,1)、把 e₂ 映到 (-1,0)，它的矩阵列应如何排列？"
