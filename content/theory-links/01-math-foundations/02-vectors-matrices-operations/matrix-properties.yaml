card:
  title: 矩阵性质：何时能用逆矩阵撤销变换
  summary: 在实现行列式与二维逆之前，先判断方阵、行列式和可逆性之间的关系。
  context: "本课会手算行列式和逆矩阵；在套公式前必须先判断变换是否丢失了方向，否则所谓撤销操作根本不存在。"
  intuition: "可逆矩阵不会把不同输入压到同一点；行列式为零正是空间被压扁、信息丢失的信号。"
  key_points:
    - "只有方阵才可能拥有双侧逆矩阵，逆矩阵满足与原矩阵相乘得到单位矩阵。"
    - "方阵行列式非零等价于列向量线性无关，也等价于该矩阵可逆。"
    - "行列式的绝对值描述体积缩放，符号还记录定向是否翻转。"
  application: "计算二维逆矩阵前先检查形状和行列式，再将候选逆矩阵左右相乘，确认结果为单位矩阵。"
  check_question: "一个二维矩阵的两列互为倍数时，行列式为何为零，它还能唯一恢复原输入吗？"
