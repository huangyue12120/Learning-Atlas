card:
  title: 矩阵运算：区分逐元素乘法与线性变换
  summary: 在实现 `matmul` 前，先用行列点积、形状规则和 Hadamard 积理解两种乘法为何不能互换。
  context: "本课同时出现逐元素乘法和矩阵乘法；两者符号相近却表达不同运算，混用会产生形状正确但语义错误的结果。"
  intuition: "Hadamard 积让相同位置彼此相乘，矩阵乘法则让左矩阵的每一行与右矩阵的每一列做点积。"
  key_points:
    - "逐元素乘法要求形状相同或可广播，输出仍按对应位置排列。"
    - "m×n 与 n×p 的矩阵积形状为 m×p，每个输出元素都是长度 n 的行列点积。"
    - "矩阵乘法通常不可交换，交换操作数不仅数值会变，甚至可能因形状不兼容而无定义。"
  application: "实现 `matmul` 时先断言内侧维度相等，用三重循环核对一个小矩阵，再与逐元素结果并排比较。"
  check_question: "两个 2×2 矩阵既能逐元素相乘也能做矩阵乘法；这两个结果的某个位置分别使用了哪些输入元素？"
