card:
  title: 用生产者—消费者模型设计群体队列
  summary: 当工作者从共享队列异步领取任务时，用并发中的生产者—消费者、同步和饥饿概念检查队列语义、负载均衡与背压，而不是把工作领取误认为无成本的并行。
  context: "本课比较固定分配和共享队列的群体架构；理解生产者、消费者和同步边界，才能解释为什么任务会堵塞、饥饿或形成热点。"
  intuition: "生产者把待办任务放入受保护的缓冲区，消费者竞争领取并确认任务；队列容量和领取协议决定系统能否吸收突发负载。"
  key_points:
    - "领取操作必须是原子的，否则两个工作者可能处理同一任务或覆盖彼此的状态。"
    - "有限队列提供背压；消费者变慢时，生产者应等待或拒绝，而不是无限堆积内存。"
    - "动态领取通常比固定分片更能平衡异构任务，但共享锁和热点会成为新的瓶颈。"
  application: "运行固定分配与共享队列实验，记录总耗时、每个工作者领取的任务数，并设计一个超时或重试策略。"
  check_question: "共享队列中的原子领取如何同时避免重复处理和工作者饥饿？"
