card:
  title: 用并发控制保护共享智能体状态
  summary: 多智能体同时写入消息池或黑板时，用互斥、乐观并发和生产者—消费者同步概念比较顺序写入、版本重试与主题分区，区分数据竞争与模型推理错误。
  context: "本课让检索、摘要、分析和验证智能体共享消息池与黑板；并发写入若没有同步，错误可能来自数据竞争而不是模型判断。"
  intuition: "共享状态像多人同时编辑一份带版本号的账本：互斥锁串行化写入，乐观并发允许重试，主题分区则把冲突隔离到不同键空间。"
  key_points:
    - "互斥锁保证临界区一次只有一个写入者，但过大的临界区会降低吞吐并增加等待。"
    - "乐观并发用版本检查发现冲突，失败写入必须重新读取并重试，不能静默覆盖。"
    - "写入来源和版本号是诊断记忆投毒、重复消息与顺序错误的重要 provenance。"
  application: "分别实现锁保护、版本重试和按主题分区的写入路径，注入并发更新后检查黑板是否保留所有可追溯版本。"
  check_question: "为什么共享黑板的版本检查失败后必须重试，而不能直接覆盖最新写入？"
