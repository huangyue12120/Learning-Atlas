card:
  title: 用假设检验判断基准差异是否可信
  summary: 比较多智能体与单智能体或随机基线时，N 次试验、p 值和显著性水平把“这次分数更高”转化为可检验的主张，避免将高方差单次运行误当作协调收益。
  context: "本课提醒你审慎阅读多智能体基准分数；同一拓扑的一次高分可能只是随机种子、任务抽样或评估污染造成的波动。"
  intuition: "把“系统真的更好”写成零假设与备择假设，再用多次独立试验估计差异和不确定性，才能判断观察到的提升是否超出噪声。"
  key_points:
    - "p 值衡量在零假设成立时观察到当前或更极端数据的概率，不是系统变好的概率。"
    - "显著性水平、试验次数和效应量应与置信区间、方差和实际部署代价一起报告。"
    - "留出任务和未污染基准能减少记忆化，但不能替代多种基线与可复现实验协议。"
  application: "对不同拓扑和随机基线运行多次 sweep，报告均值、标准差、效应量与假设检验结果，再写出不过度外推的结论。"
  check_question: "为什么一次运行中更高的基准分数不足以证明多智能体协调带来了真实收益？"
