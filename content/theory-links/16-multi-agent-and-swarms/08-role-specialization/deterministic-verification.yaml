card:
  title: 用确定性测试承担验证角色
  summary: 为多智能体流水线配置验证者时，用测试与质量保证的检查层级区分主观批评和可复现的通过/失败证据，避免所有角色只给出“看起来不错”的判断。
  context: "本课把规划、执行、批评和验证拆成不同角色；你需要在批评者可能漏掉明显 bug 时，给流水线一个可复现的质量闸门。"
  intuition: "批评者提供有价值但带偏差的判断，验证者则把制品交给确定性测试；两者串联后，主观审阅和运行时证据互相补足。"
  key_points:
    - "批评者通常依据提示词和静态阅读做主观判断，可能被看似合理的实现误导。"
    - "验证者应运行测试、类型检查或模式校验，并返回可重复的通过/失败证据。"
    - "先做低成本批评再做确定性验证，可以减少昂贵测试次数，同时保留运行时防线。"
  application: "为执行者生成的函数准备边界用例和静态检查，比较批评者报告与验证者结果，并把失败证据反馈给最多两轮修订。"
  check_question: "为什么一个“看起来不错”的批评者不能替代运行确定性测试的验证者？"
