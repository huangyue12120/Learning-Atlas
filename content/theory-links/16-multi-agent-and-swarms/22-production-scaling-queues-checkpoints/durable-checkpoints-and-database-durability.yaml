card:
  title: 用 ACID 耐久性理解可恢复检查点
  summary: 为每个超级步骤持久化状态、在工作器崩溃后从最后检查点恢复时，数据库的原子性、一致性和耐久性说明了为何检查点写入必须可审计、可序列化，并能作为安全重放的边界。
  context: "本课把长时程多智能体运行放到队列和工作器上；检查点若只留在内存，崩溃会丢失状态并让重放产生重复副作用。"
  intuition: "检查点是一道可提交的事务边界：状态完整写入后才对恢复器可见，崩溃只能回到最后一个一致版本，而不是半条轨迹。"
  key_points:
    - "原子性避免只写入部分状态，一致性要求每个检查点满足状态不变量。"
    - "隔离或串行化写入能防止并发工作器互相覆盖同一 run 的进度。"
    - "耐久性只保证已提交数据在进程重启后仍存在，不会自动让外部副作用幂等。"
  application: "运行检查点示例并模拟工作器崩溃，从最后超级步骤恢复；为状态表增加版本、时间戳和 run 标识以便审计。"
  check_question: "为什么数据库的耐久性仍不能单独保证多智能体运行的外部副作用只发生一次？"
