card:
  title: LLM 路由策略与负载均衡
  summary: 在按优先级、成本、延迟或任务类型选择模型并执行故障转移时，用系统设计中的负载均衡概念核对轮询、加权、最少连接和一致性哈希各自保留的状态与权衡。
  context: "本课不仅要决定使用哪类模型，还要在同类后端之间分配流量；不同算法利用的负载与亲和信息并不相同。"
  intuition: "负载均衡把请求分摊到多个可用副本：简单算法追求均匀，更有状态的算法则利用容量、活跃连接或缓存亲和性作选择。"
  key_points:
    - "轮询简单但忽略请求长度和服务器当前负载。"
    - "加权轮询按容量分配流量，最少连接更能适应处理时长不一的请求。"
    - "一致性哈希维持键到后端的稳定映射，可提高会话或前缀缓存命中。"
  application: "先用任务策略选择模型层级，再为该层级的副本选择负载算法，并在副本下线时检查流量迁移、缓存命中与尾延迟。"
  check_question: "当不同 LLM 请求的生成长度差异很大时，为什么简单轮询可能比最少连接产生更不均衡的负载？"
