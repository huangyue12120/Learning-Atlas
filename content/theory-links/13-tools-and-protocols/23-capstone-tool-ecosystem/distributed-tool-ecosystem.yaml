card:
  title: 工具生态系统的分布式边界
  summary: 在设计多服务器、网关、认证、重试和观测组成的工具生态时，用分布式系统理论核对组件边界、故障传播和可靠性。
  context: "本课要把注册、网关、认证、工具服务和观测组合成完整系统；跨网络边界后，任何组件都可能独立变慢、失败或返回重复结果。"
  intuition: "分布式工具生态不是一台更大的机器，而是一组通过不可靠网络协作的独立组件；可靠性来自显式协议、状态归属和故障处理。"
  key_points:
    - "远程调用可能成功、失败或结果未知，超时本身不能证明服务端没有执行。"
    - "重试需要幂等操作或幂等键，否则同一副作用可能被重复提交。"
    - "端到端 trace、结构化日志和健康信号帮助定位故障发生在哪个边界。"
  application: "为一次工具调用画出注册发现、网关、鉴权和后端链路，逐段定义超时、重试、幂等键、错误传播和可观测字段。"
  check_question: "客户端超时后立即重试一个创建资源的工具，为什么可能产生两个资源，应该用什么机制避免？"
