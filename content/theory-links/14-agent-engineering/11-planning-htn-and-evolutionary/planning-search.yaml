card:
  title: HTN 分解与搜索式规划
  summary: 在把高层任务递归分解为可执行子任务并用搜索比较计划时，用图论理论核对状态空间、依赖边和拓扑约束。
  context: "本课把一个高层目标拆成带前置条件的子任务，再在可行的依赖关系中搜索执行顺序。"
  intuition: "计划可以看成状态空间中的路径：分解产生更多节点，依赖关系限制可走的边，完成计划就是找到一条满足约束的路径。"
  key_points:
    - "HTN 方法把抽象任务递归展开为更具体、可执行的操作。"
    - "前置条件和资源依赖决定哪些任务边可以被合法执行。"
    - "搜索策略要在计划质量、分支数量和执行成本之间取舍。"
  application: "先把任务画成依赖图，检查分解后是否存在环或未满足前置条件，再让规划器搜索并验证一条可执行计划。"
  check_question: "当任务依赖图存在环时，为什么继续搜索不能得到合法的执行顺序？"
