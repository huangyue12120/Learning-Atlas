card:
  title: PagedAttention 的 KV 缓存分页
  summary: 在模拟固定 16 词元块、空闲列表和前缀共享时，用服务理论笔记把逻辑 KV 页映射到非连续显存，理解按需分配、消除碎片与写时复制如何共同提高批量吞吐。
  context: "连续预留每个请求的最大 KV 长度会浪费显存，变长请求的到达与结束又会产生碎片；本课需要一种不改变逻辑词元顺序的动态分配方式。"
  intuition: "像虚拟内存一样保持逻辑序列连续，却允许其 KV 块散落在任意空闲物理页；页表负责把位置翻译成真实存储。"
  key_points:
    - "KV 缓存按固定词元数的块按需分配，未使用的最大长度不必提前占用物理显存。"
    - "请求的逻辑块表可指向非连续物理块，因此释放任意请求后空闲块能立即复用。"
    - "并行样本可以共享相同前缀块，分叉写入时再复制，避免重复保存公共 KV。"
  application: "在模拟器中交错创建、扩展和结束不同长度请求，核对页表读序不变，并统计预留浪费、碎片与前缀共享节省量。"
  check_question: "两个请求共享前缀块后，其中一个继续生成时为什么需要写时复制而不能直接改共享块？"
