card:
  title: 推测解码的草拟、验证与分布保持
  summary: 在实现接受概率 min(1,q/p)、拒绝后的残差分布和奖励词元时，用部署理论笔记核对草稿—验证流程，并理解为什么拒绝采样能在减少大模型调用的同时保持目标分布不变。
  context: "本课追求的是无损加速而非近似生成；只保留验证器同意的草稿而不做正确的随机校正，会悄悄改变目标模型的输出分布。"
  intuition: "便宜模型负责一次提出多步猜测，昂贵模型一次并行批改；接受率决定省下多少调用，拒绝采样负责把概率账目补平。"
  key_points:
    - "草稿模型按 p 逐词元提议，目标模型用一次前向同时给出各位置的 q。"
    - "草稿词元按 min(1,q(d)/p(d)) 从左到右接受，首次拒绝时从归一化的正残差 (q−p)₊ 采样并丢弃其后草稿。"
    - "全部草稿接受后还能从目标模型的下一位置分布取得一个奖励词元；速度收益主要取决于接受率与草稿成本。"
  application: "在小词表上大量采样，比较推测解码与直接按 q 采样的经验频率，同时记录每次验证接受的词元数。"
  check_question: "首次拒绝后若直接从完整 q 重采样而不用正残差分布，为什么会重复计入一部分概率质量？"
