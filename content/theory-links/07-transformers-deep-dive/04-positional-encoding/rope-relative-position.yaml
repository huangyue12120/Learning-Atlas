card:
  title: 从正弦编码到 RoPE 的相对位置
  summary: 在实现正弦位置编码和 RoPE 旋转时，用理论笔记中的二维旋转矩阵与 RₘᵀRₙ=Rₙ₋ₘ 推导核对代码，理解为什么旋转后的 Q·K 只依赖相对位置。
  context: "自注意力本身无法区分词元排列，本课又要实现两类位置方案；必须明确位置信号是加到输入上，还是作用在 Q、K 的成对维度上。"
  intuition: "RoPE 给每个位置一个旋转相位；两个位置做点积时，公共的绝对旋转被抵消，只剩它们之间的相位差。"
  key_points:
    - "正弦位置编码以不同频率的正弦和余弦向量加到词元表示上，提供绝对位置模式。"
    - "RoPE 将 Q、K 的相邻两维视为二维平面，并按位置与频率旋转，不直接旋转 V。"
    - "由 RₘᵀRₙ=Rₙ₋ₘ，旋转后查询与键的点积只依赖位置差 n−m。"
  application: "先验证每对维度的旋转保持向量范数，再把 Q、K 同时平移若干位置，检查对应注意力分数保持不变。"
  check_question: "若只旋转 Q 而不按各自位置旋转 K，RₘᵀRₙ 的相对位置性质还会成立吗？"
