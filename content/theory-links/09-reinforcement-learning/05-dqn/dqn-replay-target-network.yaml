card:
  title: DQN 的回放缓冲区与目标网络
  summary: 在把 Q 表替换为神经网络并编写 TD 损失时，用强化学习理论笔记复核经验回放如何打散相关性、目标网络如何冻结自举目标以及对应的 DQN 损失。
  context: "神经网络会让许多状态的 Q 值一起变化，而 TD 目标又依赖同类估计；直接按连续轨迹在线回归，输入相关性与移动目标会相互放大不稳定。"
  intuition: "回放缓冲区把时间相邻的经验洗牌，目标网络则暂时冻结要追赶的标尺，让在线网络面对更像普通监督学习的批次。"
  key_points:
    - "DQN 回归目标为 r+γ max_a′Q(s′,a′;θ⁻)，在线网络 Q(s,a;θ) 最小化二者平方差。"
    - "经验回放随机抽取过去转移，打破连续观测相关性并让稀有经验被多次利用。"
    - "目标参数 θ⁻ 只周期性从在线参数复制或缓慢更新，使多个梯度步骤共享相对稳定的自举目标。"
  application: "分别关闭回放与目标网络做消融，记录 TD 损失、Q 值范围和回报曲线，并验证目标网络在同步间隔内参数不变。"
  check_question: "若同一个在线网络同时产生目标并在每步被更新，为什么会出现追逐不断移动目标的反馈回路？"
