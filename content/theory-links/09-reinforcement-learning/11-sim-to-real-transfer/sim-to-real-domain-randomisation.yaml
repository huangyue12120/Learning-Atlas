card:
  title: 现实差距与领域随机化
  summary: 在设置质量、摩擦、传感器和执行器的随机化范围时，用机器人学习笔记核对现实差距、领域随机化、系统辨识和少量真实数据微调各自解决的问题。
  context: "本课在可控模拟器里训练，却要部署到参数未知且带噪的真实环境；如果只在单一模拟参数上成功，策略可能利用现实中不存在的精确规律。"
  intuition: "不要让策略记住一个完美模拟器，而是每天给它一个略不同的世界；只要真实世界落在这组变化内，稳健行为就能迁移。"
  key_points:
    - "领域随机化在训练中改变质量、摩擦、延迟、传感器噪声或视觉条件，使策略学习对这些变化不敏感的特征。"
    - "随机范围应覆盖可信现实不确定性；过窄无法包住真实系统，过宽会像过强正则化一样得到过度保守策略。"
    - "系统辨识先用真实测量把模拟器调近现实，少量真实微调再纠正剩余偏差，二者可与随机化组合。"
  application: "在带不同 slip 参数的并行环境训练，留出未见参数作为模拟现实测试，并用失败区间反向调整随机范围而非盲目扩大。"
  check_question: "真实摩擦系数落在训练随机范围之外时，为什么领域随机化不再提供可靠的零样本迁移保证？"
