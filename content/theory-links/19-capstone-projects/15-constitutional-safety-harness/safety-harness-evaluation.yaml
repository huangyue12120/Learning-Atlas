card:
  title: 红队成功率与过度拒答的评估闭环
  summary: 在用攻击阻断率、良性通过率和留出前后测量评估安全流水线时，用机器学习系统评估理论核对切片、基线、线上实验与回归监控之间的证据边界。
  context: "安全流水线需要同时拦住攻击并放行正常请求，单看拒绝数量会奖励过度拒答。"
  intuition: "离线留出集提供可重复比较，分切片指标揭示平均值掩盖的问题。线上评估还要监控质量、延迟和正常用户可用性等护栏。"
  key_points:
    - "分别统计攻击成功率和良性通过率，并给出分母。"
    - "调阈值的数据与最终验收数据应分开。"
    - "新攻击族和不同语言需要独立切片，测试通过不构成普遍安全证明。"
  application: "运行 harness 记录攻击被阻断数和良性通过数，改变阈值后列出两类错误的变化，再用未参与调参的样本复测。"
  check_question: "如果攻击阻断率从 90% 升到 99%，还需要哪项指标才能判断这次调整是否值得发布？"
