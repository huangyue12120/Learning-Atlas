card:
  title: 自适应导师的前后测与基线比较
  summary: 在比较自适应导师与线性内容交付的学习增益、置信区间和安全护栏时，用 ML 系统评估理论核对前测/后测、对照组、线上效果与 guardrail 指标。
  context: "导师生成的提示看起来合理，不代表学习效果优于线性课程；需要把学习增益与对照基线一起测量。"
  intuition: "前后测记录同一学习者的变化，对照组帮助区分教学效果与重复测试、时间或样本差异。随机分组和置信区间让结论更可解释。"
  key_points:
    - "先固定主要指标、前后测和对照条件，再观察结果。"
    - "应按学习者而非单次消息处理独立性，避免重复观测夸大样本量。"
    - "收益还需与错误提示、安全护栏、延迟和成本共同评估。"
  application: "把演示的掌握度更新视为机制模拟，设计同样题目难度与时长的线性课程对照，说明分组方式、增益定义和不确定性报告方法。"
  check_question: "如果使用导师的学习者后测高分，但他们前测也更高，能直接归因于导师吗，应如何比较？"
