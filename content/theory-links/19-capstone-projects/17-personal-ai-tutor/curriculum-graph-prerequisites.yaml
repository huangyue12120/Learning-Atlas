card:
  title: 课程图中的概念节点与先修路径
  summary: 在按先修边遍历课程图、选择下一个概念并避免跳过基础知识时，用图论理论核对节点、边、路径和搜索边界。
  context: "自适应导师按概念掌握情况选择下一课，必须先确认先修边方向和可学习节点集合。"
  intuition: "课程图用有向边表示先修关系。拓扑顺序给出合法学习次序，掌握状态决定当前可选节点；有环会让先修条件互相等待。"
  key_points:
    - "明确边是先修指向后续，还是后续指向先修，遍历逻辑必须一致。"
    - "检查所有必要前驱已满足，再按策略选择下一节点。"
    - "图结构合理不等于教学有效，选择策略仍需学习效果评估。"
  application: "在示例课程图中画出一个概念的全部先修路径，改变其前驱掌握度，检查下一概念是否按预期解锁；再加入环测试诊断。"
  check_question: "如果只检查一个直接先修节点，却忽略它尚未掌握的前驱，会发生什么选课错误？"
