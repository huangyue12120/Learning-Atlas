card:
  title: 视频帧、时间词元与 grounding 窗口
  summary: 在将场景帧、字幕和转写嵌入合并，并把查询细化为开始/结束时间窗口时，用视频词元化理论核对时空表示、时间压缩和 temporal grounding 之间的关系。
  context: "视频问答不只检索相关帧，还要把答案定位回原视频时间；采样和压缩决定了哪些事件仍可被看见。"
  intuition: "视频表示同时压缩空间与时间。相邻帧冗余允许减少词元，但短暂动作可能被稀疏采样漏掉；时间 grounding 还需要保留帧、字幕和转写的时间戳。"
  key_points:
    - "采样密度决定可观察的最短事件尺度。"
    - "融合多模态证据前要统一时间基准。"
    - "理论笔记讨论视频词元化，本课检索窗口与时间细化策略需用定位误差单独评估。"
  application: "对同一查询记录初始候选和细化后的开始/结束时间，再缩短目标事件持续时间，检查粗采样是否仍能命中。"
  check_question: "若一个动作只持续 0.2 秒，而采样间隔为 1 秒，时间词元本身能保证找回动作吗，为什么？"
