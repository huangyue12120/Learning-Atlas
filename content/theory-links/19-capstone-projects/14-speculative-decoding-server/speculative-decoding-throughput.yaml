card:
  title: 草稿—目标模型协作与推测解码吞吐
  summary: 在由廉价草稿模型提出词元、再由目标模型批量验证时，用自回归文本生成理论核对条件分布、接受前缀和拒绝重采样如何改变解码成本。
  context: "草稿模型一次提出多个词元，目标模型并行验证；要同时核对分布正确性与实际加速条件。"
  intuition: "便宜的提议减少昂贵目标模型的串行调用。接受与拒绝修正必须匹配目标分布，草稿成本、接受前缀长度和批处理开销共同决定吞吐。"
  key_points:
    - "对随机采样，接受概率涉及目标与草稿概率之比。"
    - "拒绝位置需要按校正后的残差分布采样。"
    - "高接受率有利于加速，但不足以单独证明端到端收益。"
  application: "比较不同草稿长度的 accepted tokens、目标调用次数和速度；用目标直接采样作分布对照，避免只凭一条生成文本判断正确性。"
  check_question: "如果接受率提高但端到端吞吐下降，哪些额外成本可能抵消了收益？"
