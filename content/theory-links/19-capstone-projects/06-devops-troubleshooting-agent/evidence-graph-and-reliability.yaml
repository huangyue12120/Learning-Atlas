card:
  title: K8s 证据图与故障根因排序
  summary: 在沿 K8s 所有权、调度和观测边收集遥测证据并给根因假设排序时，用基础设施可靠性与图结构直觉核对依赖传播、证据路径和只读修复边界。
  context: "故障诊断沿部署、节点和遥测之间的关系收集证据，随后才提出修复动作；需要区分关联、根因与执行权限。"
  intuition: "图结构组织依赖和证据路径，可靠性指标指出受影响范围。根因排序只是候选解释，写操作还需要独立的审批和审计。"
  key_points:
    - "每个根因假设应能追溯到具体遥测或对象。"
    - "同时出现的异常不能单独证明因果，需要时间顺序或干预等补充证据。"
    - "只读诊断与写入修复应采用不同权限。"
  application: "追踪示例首位根因的 citations，比较批准前后同一修复工具的返回值，确认审计日志包含调用、结果与审批状态。"
  check_question: "若错误率在回滚后下降，还需要排除哪些因素才能把改善归因于回滚？"
