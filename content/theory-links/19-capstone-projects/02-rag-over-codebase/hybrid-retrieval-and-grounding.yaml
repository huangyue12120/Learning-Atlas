card:
  title: 混合检索如何形成有依据的上下文
  summary: 在并行运行稠密检索与 BM25、合并候选、重排并强制 file:line 引用时，用高级文本生成理论核对检索结果如何成为生成模型的条件上下文，以及检索与生成各自的误差边界。
  context: "代码问答先找文件和符号，再把证据交给模型；需要分别定位召回缺失、排序错误和生成无依据的问题。"
  intuition: "稠密检索找语义近邻，BM25 找词项匹配。融合与重排决定哪些片段进入上下文，生成器只能使用这份有限的证据集合。"
  key_points:
    - "混合检索需要保留文件、行号等来源元数据。"
    - "RRF 按排名融合，不要求两路原始分数处于同一量纲。"
    - "引用能帮助核查答案，但引用存在不等于内容支持结论。"
  application: "对同一查询记录 dense、sparse、fused 和 rerank 的首位结果，检查正确代码片段在哪一阶段进入或离开候选集。"
  check_question: "若正确函数从未进入任何一路候选，换一个更强的生成模型能修复哪一部分，不能修复哪一部分？"
