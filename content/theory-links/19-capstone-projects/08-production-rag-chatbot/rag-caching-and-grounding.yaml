card:
  title: 受监管 RAG 的检索、条件上下文与引用
  summary: 在按角色与司法辖区过滤、混合检索、重排并通过 RAGAS 和引用锚点评估答案时，用检索增强生成的数据流核对外部证据如何进入生成条件，以及提示词缓存为何要求稳定前缀。
  context: "受权限约束的 RAG 要先筛选可见证据，再排序和生成，同时避免缓存把不同角色的内容混在一起。"
  intuition: "检索内容成为生成的条件上下文。稳定前缀便于复用计算，但权限、语料与版本变化必须体现在上下文或缓存边界中。"
  key_points:
    - "角色与司法辖区过滤应在受限证据进入生成上下文前生效。"
    - "提示词缓存复用前缀计算，不等于缓存最终答案。"
    - "引用和忠实度评估分别检查可追溯性与内容支持程度。"
  application: "重复同一角色查询观察 cache_hit，再切换角色与司法辖区，核对引用集合和缓存键；记录被拒绝请求是否仍接触了受限片段。"
  check_question: "如果两个角色的问题相同但可见语料不同，缓存键只含问题文本会带来什么风险？"
