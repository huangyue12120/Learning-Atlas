card:
  title: 编码智能体的规划—行动—观察—恢复循环
  summary: 在把模型输出、工具执行、观察摘要和恢复策略接回每一回合时，用自回归生成与反馈轨迹理论理解为什么工具循环而非单次模型调用决定智能体行为。
  context: "模型每次生成工具调用后，都要把执行结果接回上下文；这里需要区分文本预测与有外部反馈的控制循环。"
  intuition: "下一步生成以已有轨迹为条件。工具返回值改变轨迹，控制器则决定继续、压缩还是停止；计划不会因写进提示词就自动得到执行。"
  key_points:
    - "模型生成的调用先经工具契约校验，再进入执行器。"
    - "失败观察也应回到上下文，让下一轮能够修复输入或调整计划。"
    - "回合上限与预算由控制器落实，不能依赖模型主动遵守。"
  application: "运行演示后沿 trace 找到一次工具调用、对应观察和下一轮动作；把工具返回改为失败，检查计划状态是否仍被错误地标记完成。"
  check_question: "如果工具执行失败但模型宣布完成，应该在哪一层阻止完成状态，为什么？"
