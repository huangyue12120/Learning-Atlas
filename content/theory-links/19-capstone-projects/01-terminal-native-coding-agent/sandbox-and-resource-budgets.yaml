card:
  title: 编码智能体的沙箱隔离与成本边界
  summary: 在把 worktree、沙箱、每回合词元上限、会话预算和硬回合上限组合成运行边界时，用大规模基础设施中的隔离、可靠性与成本控制直觉核对失败范围和资源预算。
  context: "编码智能体可以执行命令，错误会同时消耗算力、改动文件；需要把运行预算和失败范围变成可执行的限制。"
  intuition: "预算像可靠性系统中的资源额度，隔离像限制故障传播的边界。额度回答还能运行多久，隔离回答失败能够影响哪里，两者需要分别验证。"
  key_points:
    - "worktree 隔开版本改动，但本身不隔离网络、进程和文件系统权限。"
    - "每回合词元限制、会话成本与最大回合数约束不同的资源维度。"
    - "超时、拒绝事件和预算耗尽都应写入轨迹，便于定位停止原因。"
  application: "把预算调低，确认循环在额度耗尽后停止；再检查路径和 shell 工具的实际实现，列出仍需要容器或操作系统落实的限制。"
  check_question: "为何一个只能运行十回合的智能体，仍可能在第一回合写坏工作区外的文件？"
