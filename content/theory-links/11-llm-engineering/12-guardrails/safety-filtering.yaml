card:
  title: 输入–模型–输出的安全边界
  summary: 在设计输入过滤、提示注入检测、模型调用前后校验和人工升级时，用 Transformer 语言模型笔记明确模型生成本身的概率性，以及 guardrail 不等同于模型对齐；该关联先保留候选状态。
  context: "本课要在模型调用前后放置安全检查；必须把概率生成、确定性权限和人工升级分层，才能避免把单一过滤器当成完整防线。"
  intuition: "Guardrail 是围绕模型布置的输入、执行和输出控制层，它降低风险但不会改变模型本身所有可能行为。"
  key_points:
    - "输入检查可识别已知模式，却可能产生漏报和误报。"
    - "工具权限和数据访问应由确定性代码执行，而不是交给模型自我约束。"
    - "输出检查只能看到已生成结果，无法撤销已经发生的外部副作用。"
  application: "按输入、模型、工具和输出四个边界列出威胁与控制，并为高风险或不确定结果设计人工升级路径。"
  check_question: "为什么只在最终文本输出后做安全过滤，无法保护已经执行的高风险工具调用？"
