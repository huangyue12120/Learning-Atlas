card:
  title: 上下文窗口、注意力与信息预算
  summary: 在设计上下文压缩、记忆、检索和 lost-in-the-middle 防护时，用推理部署笔记核对 KV 缓存、前缀复用和上下文长度带来的内存约束；该关联先保留候选状态，因为理论笔记未覆盖完整的上下文工程方法。
  context: "本课要在有限上下文窗口中安排指令、历史、检索证据和当前问题；每个保留词元都会占用注意力与 KV 缓存预算。"
  intuition: "上下文不是免费的存储区，而是一段模型必须预填充并在后续解码中持续携带键和值的工作记忆。"
  key_points:
    - "上下文越长，预填充计算和每层 KV 缓存占用通常越大。"
    - "前缀复用减少重复预填充，但不会消除活动序列本身的缓存需求。"
    - "检索和压缩是在相关性、信息损失与词元预算之间做取舍。"
  application: "给不同上下文来源分配预算，把稳定前缀放在前面，并通过检索或摘要只保留回答当前问题所需的信息。"
  check_question: "为什么把所有历史原样塞进上下文，既可能增加成本又不一定提高回答质量？"
