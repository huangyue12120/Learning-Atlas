<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" width="650" height="300">
  <text x="325" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">内存等级:速度对大小权衡</text>

  <!-- Pyramid layers (top = fast+small, bottom = slow+large) -->
  <polygon points="325,45 280,95 370,95" fill="#e74c3c" fill-opacity="0.2" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="325" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#e74c3c">登记册</text>

  <polygon points="280,100 240,145 410,145 370,100" fill="#f39c12" fill-opacity="0.2" stroke="#f39c12" stroke-width="1.5"/>
  <text x="325" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f39c12">L1 缓存</text>

  <polygon points="240,150 200,195 450,195 410,150" fill="#f1c40f" fill-opacity="0.2" stroke="#f1c40f" stroke-width="1.5"/>
  <text x="325" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#d4ac0d">L2 / L3 缓存</text>

  <polygon points="200,200 155,245 495,245 450,200" fill="#27ae60" fill-opacity="0.2" stroke="#27ae60" stroke-width="1.5"/>
  <text x="325" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#27ae60">内存(DRAM)</text>

  <polygon points="155,250 115,290 535,290 495,250" fill="#3498db" fill-opacity="0.2" stroke="#3498db" stroke-width="1.5"/>
  <text x="325" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#3498db">SSD / HDD 软件</text>

  <!-- Speed labels (left) -->
  <text x="25" y="52" text-anchor="start" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">~0.3纳秒</text>
  <text x="25" y="130" text-anchor="start" font-family="Arial, sans-serif" font-size="9" fill="#f39c12">~1纳秒</text>
  <text x="25" y="178" text-anchor="start" font-family="Arial, sans-serif" font-size="9" fill="#d4ac0d">~4-10纳秒</text>
  <text x="25" y="228" text-anchor="start" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">~50-100纳秒</text>
  <text x="25" y="276" text-anchor="start" font-family="Arial, sans-serif" font-size="9" fill="#3498db">~10微秒 - 10微秒</text>

  <!-- Size labels (right) -->
  <text x="560" y="80" text-anchor="start" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">~KB(英语:KB)</text>
  <text x="560" y="130" text-anchor="start" font-family="Arial, sans-serif" font-size="9" fill="#f39c12">32-64 KB (韩语)</text>
  <text x="560" y="178" text-anchor="start" font-family="Arial, sans-serif" font-size="9" fill="#d4ac0d">256 KB- 64 MB 设备</text>
  <text x="560" y="228" text-anchor="start" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">8-512 GB 数字</text>
  <text x="560" y="276" text-anchor="start" font-family="Arial, sans-serif" font-size="9" fill="#3498db">256GB - 20 TB(英语:</text>

  <!-- Arrows -->
  <text x="25" y="38" text-anchor="start" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#666">快点</text>
  <text x="560" y="38" text-anchor="start" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#666">较大 +</text>
</svg>