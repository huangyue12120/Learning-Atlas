<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290">
  <defs>
    <marker id="arr4" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0,0 10,3 0,6" fill="#666"/>
    </marker>
    <marker id="arr4r" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0,0 10,3 0,6" fill="#e74c3c"/>
    </marker>
    <marker id="arr4g" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0,0 10,3 0,6" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">用扬声器进行语音转换</text>

  <!-- ===== TOP PATH: Source Speaker ===== -->

  <!-- Source Audio -->
  <rect x="20" y="50" width="95" height="50" rx="8" fill="#3498db" fill-opacity="0.15" stroke="#3498db" stroke-width="1.5"/>
  <text x="67" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#3498db">源音频</text>
  <text x="67" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">发言者A</text>
  <!-- Small waveform -->
  <polyline points="30,90 38,86 46,94 54,84 62,93 70,85 78,92 86,87 94,91 102,88" fill="none" stroke="#3498db" stroke-width="0.7" stroke-opacity="0.4"/>

  <!-- Arrow to encoder -->
  <line x1="115" y1="75" x2="142" y2="75" stroke="#666" stroke-width="1.2" marker-end="url(#arr4)"/>

  <!-- Content Encoder -->
  <rect x="144" y="45" width="110" height="60" rx="8" fill="#9b59b6" fill-opacity="0.12" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="199" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#9b59b6">内容编码器</text>
  <text x="199" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">提取语言</text>
  <text x="199" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">内容特性</text>

  <!-- Arrow to content representation -->
  <line x1="254" y1="75" x2="278" y2="75" stroke="#666" stroke-width="1.2" marker-end="url(#arr4)"/>

  <!-- Content Representation (speaker-independent) -->
  <rect x="280" y="45" width="120" height="60" rx="8" fill="#27ae60" fill-opacity="0.12" stroke="#27ae60" stroke-width="2"/>
  <text x="340" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#27ae60">内容</text>
  <text x="340" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#27ae60">代表权</text>
  <text x="340" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">(口语独立.</text>

  <!-- Disentanglement visual: dashed line separating content from identity -->
  <line x1="270" y1="120" x2="410" y2="120" stroke="#e74c3c" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="340" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#e74c3c" font-style="italic">分解边界</text>

  <!-- Content label above -->
  <text x="310" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#27ae60">说什么</text>
  <!-- Identity label below -->
  <text x="370" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#e74c3c">卫生组织说</text>

  <!-- ===== BOTTOM PATH: Target Speaker ===== -->

  <!-- Target Speaker Audio -->
  <rect x="20" y="158" width="95" height="50" rx="8" fill="#e74c3c" fill-opacity="0.15" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="67" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#e74c3c">目标音频</text>
  <text x="67" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">发言者B</text>
  <text x="67" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">(参考文献)</text>

  <!-- Arrow to speaker encoder -->
  <line x1="115" y1="183" x2="142" y2="183" stroke="#666" stroke-width="1.2" marker-end="url(#arr4)"/>

  <!-- Speaker Encoder -->
  <rect x="144" y="153" width="110" height="60" rx="8" fill="#f39c12" fill-opacity="0.12" stroke="#f39c12" stroke-width="1.5"/>
  <text x="199" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#f39c12">扬声器编码器</text>
  <text x="199" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">提取扬声器</text>
  <text x="199" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">身份嵌入</text>

  <!-- Arrow to speaker embedding -->
  <line x1="254" y1="183" x2="278" y2="183" stroke="#666" stroke-width="1.2" marker-end="url(#arr4)"/>

  <!-- Speaker Embedding -->
  <rect x="280" y="158" width="120" height="50" rx="8" fill="#e74c3c" fill-opacity="0.12" stroke="#e74c3c" stroke-width="2"/>
  <text x="340" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#e74c3c">发言者</text>
  <text x="340" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#e74c3c">嵌入</text>
  <text x="340" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">d- 显示器 / x- 显示器</text>

  <!-- ===== MERGE: Both paths into Decoder ===== -->

  <!-- Arrow from content to decoder -->
  <path d="M400,75 Q430,75 445,100 L460,115" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr4g)"/>
  <text x="418" y="86" font-family="Arial, sans-serif" font-size="7" fill="#27ae60">内容</text>

  <!-- Arrow from speaker embedding to decoder -->
  <path d="M400,183 Q430,183 445,158 L460,143" fill="none" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arr4r)"/>
  <text x="418" y="176" font-family="Arial, sans-serif" font-size="7" fill="#e74c3c">身份</text>

  <!-- Decoder -->
  <rect x="462" y="100" width="100" height="60" rx="8" fill="#9b59b6" fill-opacity="0.15" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="512" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#9b59b6">解码器</text>
  <text x="512" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">合成 mel /</text>
  <text x="512" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">波形</text>

  <!-- Arrow to output -->
  <line x1="562" y1="130" x2="590" y2="130" stroke="#666" stroke-width="1.2" marker-end="url(#arr4)"/>

  <!-- Converted Speech Output -->
  <rect x="592" y="95" width="90" height="70" rx="8" fill="#27ae60" fill-opacity="0.18" stroke="#27ae60" stroke-width="1.5"/>
  <text x="637" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#27ae60">已转换</text>
  <text x="637" y="131" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#27ae60">发言</text>
  <text x="637" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">目标声音</text>
  <text x="637" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">来源内容</text>

  <!-- Waveform squiggle on output -->
  <polyline points="600,110 608,105 616,115 624,103 632,113 640,104 648,112 656,106 664,111 672,107" fill="none" stroke="#27ae60" stroke-width="0.7" stroke-opacity="0.4"/>

  <!-- ===== NOTE BOX ===== -->
  <rect x="20" y="230" width="660" height="45" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="35" y="247" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#333">说明:</text>
  <text x="70" y="247" font-family="Arial, sans-serif" font-size="9" fill="#666">关键挑战:将所说的话(内容)与谁说的(身份)分开。方法包括信息</text>
  <text x="35" y="262" font-family="Arial, sans-serif" font-size="9" fill="#666">瓶颈,例如正常化、向量量化(VQ-VAE)和脱口秀的对抗训练</text>
  <text x="35" y="275" font-family="Arial, sans-serif" font-size="9" fill="#666">来自内容编码器的信息. 0射入VC对未见目标发言者使用单一的参考语.</text>
</svg>