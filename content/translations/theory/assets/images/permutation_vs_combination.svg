<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="350" y="25" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">组合</text>

  <!-- Left: Permutations -->
  <text x="175" y="55" fill="#e74c3c" font-size="13" font-weight="bold" text-anchor="middle">周期(命令事项)</text>
  <text x="175" y="75" fill="#666" font-size="11" text-anchor="middle">从{A、B、C}选取 2</text>

  <!-- Permutation boxes -->
  <rect x="70" y="90" width="55" height="28" rx="4" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1"/>
  <text x="97" y="109" fill="#e74c3c" font-size="12" text-anchor="middle">A B 类</text>

  <rect x="145" y="90" width="55" height="28" rx="4" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1"/>
  <text x="172" y="109" fill="#e74c3c" font-size="12" text-anchor="middle">B. 国家</text>

  <rect x="220" y="90" width="55" height="28" rx="4" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1"/>
  <text x="247" y="109" fill="#e74c3c" font-size="12" text-anchor="middle">甲C级</text>

  <rect x="70" y="128" width="55" height="28" rx="4" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1"/>
  <text x="97" y="147" fill="#e74c3c" font-size="12" text-anchor="middle">联合国</text>

  <rect x="145" y="128" width="55" height="28" rx="4" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1"/>
  <text x="172" y="147" fill="#e74c3c" font-size="12" text-anchor="middle">B. C 类</text>

  <rect x="220" y="128" width="55" height="28" rx="4" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1"/>
  <text x="247" y="147" fill="#e74c3c" font-size="12" text-anchor="middle">中 英 语</text>

  <text x="175" y="180" fill="#e74c3c" font-size="12" text-anchor="middle">6项安排</text>
  <text x="175" y="198" fill="#666" font-size="11" text-anchor="middle">P(3,2) = 3!/(3-2)! = 6</text>

  <!-- Divider -->
  <line x1="350" y1="45" x2="350" y2="280" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right: Combinations -->
  <text x="525" y="55" fill="#3498db" font-size="13" font-weight="bold" text-anchor="middle">组合(顺序被忽略)</text>
  <text x="525" y="75" fill="#666" font-size="11" text-anchor="middle">从{A、B、C}选取 2</text>

  <!-- Combination circles -->
  <rect x="435" y="95" width="55" height="28" rx="14" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="1"/>
  <text x="462" y="114" fill="#3498db" font-size="12" text-anchor="middle">{A,B]</text>

  <rect x="505" y="95" width="55" height="28" rx="14" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="1"/>
  <text x="532" y="114" fill="#3498db" font-size="12" text-anchor="middle">{A,C]</text>

  <rect x="575" y="95" width="55" height="28" rx="14" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="1"/>
  <text x="602" y="114" fill="#3498db" font-size="12" text-anchor="middle">{B,C} (英语).</text>

  <text x="525" y="155" fill="#3498db" font-size="12" text-anchor="middle">3组</text>
  <text x="525" y="173" fill="#666" font-size="11" text-anchor="middle">C(3,2) = 3!/(2!·1!) = 3</text>

  <!-- Connection arrows showing AB=BA merge -->
  <text x="525" y="210" fill="#666" font-size="11" text-anchor="middle">A B 和 B A 是同一个组 {A,B}</text>
  <text x="525" y="228" fill="#666" font-size="11" text-anchor="middle">所以,我们除以2! = 2个订单</text>

  <!-- Bottom summary -->
  <text x="175" y="250" fill="#e74c3c" font-size="11" text-anchor="middle">谁是第一对第二</text>
  <text x="175" y="268" fill="#e74c3c" font-size="11" text-anchor="middle">(总统诉副总统)</text>

  <text x="525" y="250" fill="#3498db" font-size="11" text-anchor="middle">仅涉及成员资格</text>
  <text x="525" y="268" fill="#3498db" font-size="11" text-anchor="middle">(选择一个委员会)</text>
</svg>