<svg width="720" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="tdiff-arrow" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#555"/>
    </marker>
    <marker id="tdiff-arrow-green" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#27ae60"/>
    </marker>
  </defs>
  <text x="360" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">文本传播:推进腐败和倒置</text>

  <!-- Forward process (top) -->
  <text x="360" y="48" fill="#e74c3c" font-size="10" font-weight="bold" text-anchor="middle">前进进程: 文本逐渐被损坏</text>

  <!-- t=0 clean -->
  <g>
    <rect x="20" y="58" width="120" height="55" rx="6" fill="#27ae60" opacity="0.1" stroke="#27ae60" stroke-width="1.5"/>
    <text x="80" y="73" fill="#27ae60" font-size="9" text-anchor="middle" font-weight="bold">t = 0(干净)</text>
    <text x="80" y="88" fill="#333" font-size="10" text-anchor="middle">猫坐了</text>
    <text x="80" y="103" fill="#333" font-size="10" text-anchor="middle">在垫子上</text>
  </g>

  <line x1="140" y1="85" x2="165" y2="85" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#tdiff-arrow)"/>

  <!-- t=T/3 partially corrupted -->
  <g>
    <rect x="170" y="58" width="120" height="55" rx="6" fill="#f39c12" opacity="0.1" stroke="#f39c12" stroke-width="1.5"/>
    <text x="230" y="73" fill="#f39c12" font-size="9" text-anchor="middle" font-weight="bold">t = T/3 (单位:千美元)</text>
    <text x="230" y="88" fill="#333" font-size="10" text-anchor="middle">该<tspan fill="#e74c3c">[男]</tspan>坐着</text>
    <text x="230" y="103" fill="#333" font-size="10" text-anchor="middle">打开<tspan fill="#e74c3c">[男]</tspan>垫子</text>
  </g>

  <line x1="290" y1="85" x2="315" y2="85" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#tdiff-arrow)"/>

  <!-- t=2T/3 mostly corrupted -->
  <g>
    <rect x="320" y="58" width="120" height="55" rx="6" fill="#e74c3c" opacity="0.1" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="380" y="73" fill="#e74c3c" font-size="9" text-anchor="middle" font-weight="bold">t = 2T/3 (单位:千美元)</text>
    <text x="380" y="88" fill="#e74c3c" font-size="10" text-anchor="middle">[M] [M]坐</text>
    <text x="380" y="103" fill="#e74c3c" font-size="10" text-anchor="middle">[男][女]</text>
  </g>

  <line x1="440" y1="85" x2="465" y2="85" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#tdiff-arrow)"/>

  <!-- t=T fully masked -->
  <g>
    <rect x="470" y="58" width="120" height="55" rx="6" fill="#e74c3c" opacity="0.2" stroke="#e74c3c" stroke-width="2"/>
    <text x="530" y="73" fill="#e74c3c" font-size="9" text-anchor="middle" font-weight="bold">t = T(噪音)</text>
    <text x="530" y="88" fill="#e74c3c" font-size="10" text-anchor="middle">[男][女]</text>
    <text x="530" y="103" fill="#e74c3c" font-size="10" text-anchor="middle">[男][女]</text>
  </g>

  <!-- Reverse process (bottom) -->
  <text x="360" y="140" fill="#27ae60" font-size="10" font-weight="bold" text-anchor="middle">倒转过程:学会了代名词(生成)</text>

  <!-- t=T noise -->
  <g>
    <rect x="470" y="150" width="120" height="55" rx="6" fill="#e74c3c" opacity="0.2" stroke="#e74c3c" stroke-width="2"/>
    <text x="530" y="165" fill="#e74c3c" font-size="9" text-anchor="middle" font-weight="bold">t = T (单位:千美元)</text>
    <text x="530" y="180" fill="#e74c3c" font-size="10" text-anchor="middle">[男][女]</text>
    <text x="530" y="195" fill="#e74c3c" font-size="10" text-anchor="middle">[男][女]</text>
  </g>

  <line x1="470" y1="177" x2="445" y2="177" stroke="#27ae60" stroke-width="1.5" marker-end="url(#tdiff-arrow-green)"/>

  <!-- Partially denoised -->
  <g>
    <rect x="320" y="150" width="120" height="55" rx="6" fill="#f39c12" opacity="0.1" stroke="#f39c12" stroke-width="1.5"/>
    <text x="380" y="165" fill="#f39c12" font-size="9" text-anchor="middle" font-weight="bold">登场</text>
    <text x="380" y="180" fill="#333" font-size="10" text-anchor="middle"><tspan fill="#e74c3c">[男]</tspan>猫<tspan fill="#e74c3c">[男]</tspan></text>
    <text x="380" y="195" fill="#333" font-size="10" text-anchor="middle">编辑<tspan fill="#e74c3c">[男]</tspan></text>
  </g>

  <line x1="320" y1="177" x2="295" y2="177" stroke="#27ae60" stroke-width="1.5" marker-end="url(#tdiff-arrow-green)"/>

  <!-- More denoised -->
  <g>
    <rect x="170" y="150" width="120" height="55" rx="6" fill="#27ae60" opacity="0.08" stroke="#27ae60" stroke-width="1.5"/>
    <text x="230" y="165" fill="#27ae60" font-size="9" text-anchor="middle" font-weight="bold">登场</text>
    <text x="230" y="180" fill="#333" font-size="10" text-anchor="middle">猫坐了</text>
    <text x="230" y="195" fill="#333" font-size="10" text-anchor="middle">编辑<tspan fill="#e74c3c">[男]</tspan></text>
  </g>

  <line x1="170" y1="177" x2="145" y2="177" stroke="#27ae60" stroke-width="1.5" marker-end="url(#tdiff-arrow-green)"/>

  <!-- t=0 clean output -->
  <g>
    <rect x="20" y="150" width="120" height="55" rx="6" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="2"/>
    <text x="80" y="165" fill="#27ae60" font-size="9" text-anchor="middle" font-weight="bold">t = 0(干净)</text>
    <text x="80" y="180" fill="#27ae60" font-size="10" text-anchor="middle" font-weight="bold">猫坐了</text>
    <text x="80" y="195" fill="#27ae60" font-size="10" text-anchor="middle" font-weight="bold">在垫子上</text>
  </g>

  <!-- Key advantage -->
  <rect x="600" y="60" width="110" height="145" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="655" y="82" fill="#333" font-size="9" text-anchor="middle" font-weight="bold">关键优势</text>
  <text x="655" y="100" fill="#555" font-size="9" text-anchor="middle">所有符号</text>
  <text x="655" y="114" fill="#555" font-size="9" text-anchor="middle">生成于</text>
  <text x="655" y="128" fill="#27ae60" font-size="10" text-anchor="middle" font-weight="bold">平行</text>
  <line x1="615" y1="140" x2="695" y2="140" stroke="#ddd" stroke-width="1"/>
  <text x="655" y="158" fill="#555" font-size="9" text-anchor="middle">启用简单</text>
  <text x="655" y="172" fill="#555" font-size="9" text-anchor="middle">填充和</text>
  <text x="655" y="186" fill="#555" font-size="9" text-anchor="middle">全球规划</text>

  <text x="360" y="232" fill="#666" font-size="10" text-anchor="middle">MDLM以遮掩为腐败;D3PM使用一般的符号转换.</text>
</svg>