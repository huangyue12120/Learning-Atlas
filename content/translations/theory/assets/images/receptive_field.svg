<svg width="700" height="285" xmlns="http://www.w3.org/2000/svg">
  <text x="350" y="22" fill="#333" font-size="14" font-weight="bold" text-anchor="middle">感受野随层数增长</text>

  <!-- Input (7x7 grid) -->
