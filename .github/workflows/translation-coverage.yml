name: Monitoring / Check translation coverage

run-name: Check translation coverage · ${{ github.event_name }}

on:
  schedule:
    - cron: "47 3 * * 1"
  # Re-check as soon as main moves the practice submodule pointer or changes the
  # adaptations or published scope, instead of waiting for the weekly run.
  push:
    branches: [main]
    paths:
      - ai-engineering-from-scratch
      - content/translations/practice/**
      - content/assessments/practice/**
      - apps/local-learning/src/server.ts
      - scripts/check_translation_coverage.py
      - scripts/published_scope.py
  workflow_dispatch:

concurrency:
  group: translation-coverage
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check-translation-coverage:
    name: Check translation coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Check Chinese practice translation coverage
        id: coverage
        shell: bash
        run: |
          # Exit code 2 reports missing adaptations and is handled through the
          # issue below; only execution errors fail the job.
          set +e
          python3 scripts/check_translation_coverage.py \
            --fail-on-missing \
            --output translation-coverage-report.md > translation-coverage.log 2>&1
          status=$?
          set -e
          cat translation-coverage.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "2" ]; then
            echo "::notice title=Translation coverage::Published phases contain upstream lessons without Chinese translations, assessments or workspace guides. See the coverage issue and job summary."
          elif [ "$status" != "0" ]; then
            exit "$status"
          fi
      - name: Add coverage report to job summary
        if: steps.coverage.outputs.exit_code == '2'
        run: cat translation-coverage-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update translation coverage issue
        if: steps.coverage.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "[Coverage] Chinese practice translations missing"
        shell: bash
        run: |
          issue_number="$(gh issue list --state open --json number,title --limit 100 | jq -r --arg title "$ISSUE_TITLE" '.[] | select(.title == $title) | .number' | head -n 1)"
          report_key="$(sed -n 's/^<!-- translation-coverage-key: \(.*\) -->$/\1/p' translation-coverage-report.md)"
          if [ -z "$report_key" ]; then
            echo "Coverage report is missing its deduplication key." >&2
            exit 1
          fi
          marker="<!-- translation-coverage-key: ${report_key} -->"
          if [ -z "$issue_number" ]; then
            gh issue create --title "$ISSUE_TITLE" --body-file translation-coverage-report.md
          else
            issue_content="$(gh issue view "$issue_number" --json body,comments)"
            if grep -Fq -- "$marker" <<< "$issue_content"; then
              echo "Issue #$issue_number already contains this coverage snapshot."
            else
              gh issue comment "$issue_number" --body-file translation-coverage-report.md
            fi
          fi
      - name: Close resolved translation coverage issue
        if: steps.coverage.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "[Coverage] Chinese practice translations missing"
        shell: bash
        run: |
          issue_number="$(gh issue list --state open --json number,title --limit 100 | jq -r --arg title "$ISSUE_TITLE" '.[] | select(.title == $title) | .number' | head -n 1)"
          if [ -n "$issue_number" ]; then
            revision="$(git -C ai-engineering-from-scratch rev-parse HEAD)"
            gh issue close "$issue_number" --comment "覆盖率检查已在 \`${revision}\` 通过：已开放 Phase 中没有缺少中文实践译文、中文测验或练习指南的上游课程。（${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}）"
          fi
