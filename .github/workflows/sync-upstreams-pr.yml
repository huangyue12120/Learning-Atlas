name: Automation / Open upstream synchronization PR

run-name: Open upstream synchronization PR · run ${{ github.run_number }}

on:
  workflow_dispatch:

concurrency:
  group: upstream-synchronization-pr
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  open-upstream-sync-pr:
    name: Open upstream synchronization PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
      - name: Update tracked upstream submodules
        id: sync
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule update --remote --checkout --recursive
          if git diff --quiet --ignore-submodules=none; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream updates are awaiting synchronization."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --submodule=short
          fi
      - name: Commit pointers and open review pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/upstream-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-engineering-from-scratch maths-cs-ai-compendium
          git commit -m "chore(upstream): synchronize tracked submodules"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(upstream): synchronize tracked submodules" \
            --body "This PR updates only submodule pointers. Review and update every affected Chinese adaptation, assessment and theory link until the validation workflow passes before merging."
          gh workflow run content-validation.yml --ref "$branch"
