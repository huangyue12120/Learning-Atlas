name: Security / Review dependency changes

run-name: Review dependency changes · PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    branches: [main]

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review-dependencies:
    name: Review dependency changes
    runs-on: ubuntu-latest
    # Only run if Advanced Security is enabled
    if: github.event.repository.security_and_analysis.advanced_security.status == 'enabled'
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
