version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot keeps the pins and
  # their version comments current through reviewable pull requests.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
