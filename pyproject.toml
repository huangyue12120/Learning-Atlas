[project]
name = "learning-atlas"
version = "0.31.0"
description = "Learning Atlas 的本地 Python 学习环境与按课可选依赖"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.23.16",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
]

[project.optional-dependencies]
math = ["jax>=0.11.0"]
ml = ["pandas>=3.0.5", "scikit-learn>=1.9.0"]
deep-learning = ["torch>=2.13.0", "transformers>=5.14.1", "tokenizers>=0.22.2", "tiktoken>=0.13.0"]
audio = ["torch>=2.13.0", "torchaudio>=2.11.0", "soundfile>=0.14.0"]
vision = ["torch>=2.13.0", "torchvision>=0.28.0", "pillow>=12.3.0"]
data = ["datasets>=5.0.1", "pandas>=3.0.5", "intake-esgf>=2026.6.4"]
notebooks = ["jupyter>=1.1.1"]
models = ["openai>=2.53.0"]
