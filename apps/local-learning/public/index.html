<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Learning Atlas</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("learning-atlas-theme");
        const darkByDefault = savedTheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = savedTheme === "dark" || darkByDefault ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#lesson">跳至课程内容</a>
    <main id="app">
      <p class="loading">正在准备本地学习空间…</p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
